<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>全生徒の打刻履歴 - 管理者</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  th {
    background: #f0f0f0;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  #logoutBtn { background:#e24a4a; }
</style>
</head>

<body>
<div class="container">
  <h2>全生徒の打刻履歴</h2>
  <p id="statusMessage">読み込み中...</p>

  <table id="recordsTable">
    <tr>
      <th>生徒ID</th>
      <th>名前</th>
      <th>状態</th>
      <th>日時</th>
    </tr>
  </table>

  <a class="button" href="admin_home.html">管理者ホームへ戻る</a>
  <a class="button" id="logoutBtn">ログアウト</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getFirestore, collection, getDocs, query, orderBy 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { 
    getAuth, onAuthStateChanged, signOut 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtBjVT9p1JlwLZhKRLzq5secW2YyD1U0U",
    authDomain: "attendance-system-eb7d1.firebaseapp.com",
    projectId: "attendance-system-eb7d1",
    storageBucket: "attendance-system-eb7d1.firebasestorage.app",
    messagingSenderId: "803269635846",
    appId: "1:803269635846:web:6e12018f4b2db2c0747887"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let students = {};

  // ログイン確認
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
    } else {
      await loadStudents();
      await loadRecords();
    }
  });

  // 生徒名簿読み込み（名前表示のため）
  async function loadStudents() {
    const snapshot = await getDocs(collection(db, "students"));
    snapshot.forEach(docSnap => {
      students[docSnap.id] = docSnap.data().name;
    });
  }

  // 全打刻履歴読み込み
  async function loadRecords() {
    const table = document.getElementById("recordsTable");

    const q = query(
      collection(db, "attendanceItems"),
      orderBy("date", "desc")
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      document.getElementById("statusMessage").textContent = "履歴がありません";
      return;
    }

    document.getElementById("statusMessage").textContent = "";

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${data.userId}</td>
        <td>${students[data.userId] || "不明"}</td>
        <td>${data.state}</td>
        <td>${data.time}</td>
      `;

      table.appendChild(row);
    });
  }

  // ログアウト
  document.getElementById("logoutBtn").onclick = () => {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  };
</script>

</body>
</html>
