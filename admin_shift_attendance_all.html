<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./shared/app-shell.css">
<title>全生徒の打刻履歴 - 管理者</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  th {
    background: #f0f0f0;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  #logoutBtn { background:#e24a4a; }
</style>
</head>

<body>
<div class="container">
  <h2>全生徒の打刻履歴</h2>
  <p id="statusMessage">読み込み中...</p>

  <table id="recordsTable">
    <tr>
      <th>生徒ID</th>
      <th>名前</th>
      <th>状態</th>
      <th>日時</th>
    </tr>
  </table>
</div>

<script type="module">
  import { 
    getFirestore, collection, getDocs, query, orderBy 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  

  import { db } from "./shared/firebase.js";
  import { requireAdmin } from "./shared/auth.js";
  import { mountAppShell } from "./shared/app-shell.js";

  let students = {};

  requireAdmin({
    loginUrl: "./index.html",
    deniedUrl: "./employee_home.html",
    onReady: async ({ profile }) => {
      mountAppShell({ active: "attendance", profile, homeHref: "./home.html", logoutUrl: "./index.html", links: [
        { id: "home", label: "ホーム", href: "./home.html" },
        { id: "attendance", label: "出勤", href: "./employee_home.html" },
        { id: "learning", label: "学習", href: "./learning/index.html" },
        { id: "wood", label: "木材", href: "./wood/index.html" }
      ] });
    await loadStudents();
    await loadRecords();
    }
  });

  // 生徒名簿読み込み（名前表示のため）
  async function loadStudents() {
    const snapshot = await getDocs(collection(db, "students"));
    snapshot.forEach(docSnap => {
      students[docSnap.id] = docSnap.data().name;
    });
  }

  // 全打刻履歴読み込み
  async function loadRecords() {
    const table = document.getElementById("recordsTable");

    const q = query(
      collection(db, "attendanceItems"),
      orderBy("date", "desc")
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      document.getElementById("statusMessage").textContent = "履歴がありません";
      return;
    }

    document.getElementById("statusMessage").textContent = "";

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${data.userId}</td>
        <td>${students[data.userId] || "不明"}</td>
        <td>${data.state}</td>
        <td>${data.time}</td>
      `;

      table.appendChild(row);
    });
  }
</script>

</body>
</html>
