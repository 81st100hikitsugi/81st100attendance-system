<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./shared/app-shell.css">
<title>全員の打刻履歴 - 管理者</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; margin:0; }
  .container {
    max-width: 1000px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  .table-wrap { width:100%; overflow-x:auto; }
  table { width:100%; min-width:650px; border-collapse:collapse; margin-top:15px; }
  th, td { border:1px solid #ddd; padding:9px; text-align:center; overflow-wrap:anywhere; }
  th { background:#f0f0f0; }
  #statusMessage { min-height:1.5em; text-align:center; color:#555; }
  @media (max-width:600px) {
    body { padding:10px; }
    .container { margin:18px auto; padding:14px; }
  }
</style>
</head>
<body>
<div class="container">
  <h2>全員の打刻履歴</h2>
  <p id="statusMessage" role="status">読み込み中...</p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ユーザーID</th><th>名前</th><th>状態</th><th>日時・シフト</th></tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { db } from "./shared/firebase.js";
  import { requireAdmin } from "./shared/auth.js";
  import { mountAppShell } from "./shared/app-shell.js";

  const statusMessage = document.getElementById("statusMessage");
  const recordsBody = document.getElementById("recordsBody");

  requireAdmin({
    loginUrl: "./index.html",
    deniedUrl: "./employee_home.html",
    onReady: async ({ profile }) => {
      mountAppShell({
        active: "attendance",
        profile,
        homeHref: "./home.html",
        logoutUrl: "./index.html",
        links: [
          { id: "home", label: "ホーム", href: "./home.html" },
          { id: "attendance", label: "出勤", href: "./employee_home.html" },
          { id: "learning", label: "学習", href: "./learning/index.html" },
          { id: "wood", label: "木材", href: "./wood/index.html" }
        ]
      });
      await loadRecords();
    },
    onError: (error) => {
      console.error("管理者確認エラー:", error);
      statusMessage.textContent = "管理者情報を確認できませんでした。";
    }
  });

  function toDate(value) {
    if (!value) return null;
    const date = typeof value.toDate === "function"
      ? value.toDate()
      : value instanceof Date ? value : new Date(value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function appendCell(row, value) {
    const cell = document.createElement("td");
    cell.textContent = value == null || value === "" ? "—" : String(value);
    row.appendChild(cell);
  }

  async function loadRecords() {
    statusMessage.textContent = "履歴を読み込んでいます...";
    recordsBody.replaceChildren();

    try {
      const [peopleSnapshot, itemsSnapshot] = await Promise.all([
        getDocs(collection(db, "students")),
        getDocs(collection(db, "attendanceItems"))
      ]);

      const names = new Map(
        peopleSnapshot.docs.map(entry => [entry.id, entry.data().name || "名前未設定"])
      );

      const records = itemsSnapshot.docs.map(entry => {
        const data = entry.data();
        const date = toDate(data.date);
        return { id: entry.id, data, date, sortTime: date ? date.getTime() : 0 };
      }).sort((a, b) => b.sortTime - a.sortTime);

      if (!records.length) {
        statusMessage.textContent = "履歴がありません。";
        return;
      }

      for (const record of records) {
        const { data, date } = record;
        const row = document.createElement("tr");
        appendCell(row, data.userId || "—");
        appendCell(row, names.get(data.userId) || "不明");

        const stateLabel = data.state || "状態未設定";
        appendCell(row, stateLabel);

        let dateLabel = date ? date.toLocaleString("ja-JP") : (data.time || "日時不明");
        if (data.state === "出勤予定" && data.shift) {
          dateLabel += " / " + data.shift;
        }
        appendCell(row, dateLabel);
        recordsBody.appendChild(row);
      }

      statusMessage.textContent = records.length + " 件の記録を表示しています。";
    } catch (error) {
      console.error("全員の打刻履歴読み込みエラー:", error);
      statusMessage.textContent = "履歴を読み込めませんでした。通信状況とFirestoreの設定を確認してください。";
    }
  }
</script>
</body>
</html>
