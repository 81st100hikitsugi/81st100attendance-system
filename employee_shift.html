
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./shared/app-shell.css?v=20261120-11">
<title>シフト確認 - 生徒用</title>

<style>
*{box-sizing:border-box}body{margin:0;padding:20px 20px 100px;background:#f5f7fa;color:#243447;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.container{max-width:1100px;margin:28px auto;padding:20px;background:#fff;border:1px solid #e1e6ed;border-radius:12px;box-shadow:0 2px 8px rgba(23,43,77,.06)}h2{margin:0 0 18px;text-align:center;font-size:22px}
.week-area{margin:16px 0 20px;text-align:center}.week-area input{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:16px}#selectedWeekLabel{margin-top:10px;font-weight:700;color:#425466}
#statusMessage{min-height:22px;margin:12px 0;text-align:center;color:#526273}.zoom-toolbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0;padding:9px 12px;border:1px solid #dce3eb;border-radius:9px;background:#f8fafc;color:#64748b;font-size:13px}
#zoomLabel{min-width:48px;color:#243447;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}#zoomReset{padding:7px 12px;border:1px solid #94a3b8;border-radius:7px;background:#fff!important;color:#1e293b!important;-webkit-text-fill-color:#1e293b!important;font:inherit;font-weight:600;cursor:pointer}
#zoomReset:hover{border-color:#2878c8;background:#eaf3ff!important;color:#174f86!important;-webkit-text-fill-color:#174f86!important}#zoomReset:focus-visible{outline:2px solid #2878c8;outline-offset:2px}
.table-zoom-content{width:max-content;min-width:100%;transform-origin:top left}.table-wrap{width:100%;max-height:68vh;overflow:auto;margin-top:16px;border:1px solid #d8e0e9;border-radius:9px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.densuke-table{width:max-content;min-width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13px}.densuke-table th,.densuke-table td{min-width:88px;height:48px;padding:5px 7px;border-right:1px solid #dce3eb;border-bottom:1px solid #dce3eb;background:#fff;text-align:center;vertical-align:middle;white-space:nowrap}
.densuke-table thead th{position:sticky;top:0;z-index:2;height:46px;background:#edf3f9;font-weight:700}.densuke-table thead th:first-child,.densuke-table thead th:nth-child(2){background:#e5edf6}
.densuke-table .date-cell{width:112px;min-width:112px;background:#f5f7fa;font-weight:700}.densuke-table .slot-cell{width:82px;min-width:82px;background:#f8fafc;color:#425466;font-size:16px;font-weight:800}
.densuke-table .assignment-cell{width:130px;min-width:130px}.scheduled-mark{color:#16834a;font-size:23px;font-weight:800}.not-scheduled-mark{color:#a0a8b2;font-size:21px;font-weight:700}
.slot-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 2px 0;color:#64748b;font-size:12px}
@media(max-width:650px){body{padding:10px 8px 100px}.container{margin:14px auto;padding:12px}h2{font-size:19px}.table-wrap{max-height:62vh}.densuke-table th,.densuke-table td{height:44px}.zoom-toolbar{gap:8px;padding:8px;text-align:center}}
body:has(.app-shell) .table-wrap .table-zoom-content{display:block!important;width:max-content!important;min-width:100%!important;visibility:visible!important}
body:has(.app-shell) .table-wrap table.densuke-table{display:table!important;width:max-content!important;min-width:100%!important;table-layout:fixed!important;border-collapse:separate!important;border-spacing:0!important;visibility:visible!important;color:#243447!important}
body:has(.app-shell) .table-wrap .densuke-table th,body:has(.app-shell) .table-wrap .densuke-table td{display:table-cell!important;visibility:visible!important;opacity:1!important;color:#243447!important;border-right:1px solid #dce3eb!important;border-bottom:1px solid #dce3eb!important;padding:5px 7px!important;text-align:center!important;vertical-align:middle!important;white-space:nowrap!important}
body:has(.app-shell) .table-wrap .densuke-table thead{display:table-header-group!important}body:has(.app-shell) .table-wrap .densuke-table tbody{display:table-row-group!important}body:has(.app-shell) .table-wrap .densuke-table tr{display:table-row!important}
</style>
<meta name="robots" content="noindex, nofollow">
</head>

<body class="app-shell-pending">

<div class="container">

  <h2>シフト確認</h2>

  <p id="statusMessage">ログイン確認中...</p>

  <div class="week-area">
    <label for="weekSelector">対象週：</label>
    <input type="date" id="weekSelector" aria-label="表示する週の日付を選択">
    <p id="selectedWeekLabel"></p>
  </div>

  <div class="zoom-toolbar" aria-label="表の表示倍率"><span id="zoomLabel">100%</span><button type="button" id="zoomReset">ズームをリセット</button></div>
  <div class="table-wrap"><div class="table-zoom-content" id="tableZoomContent"><table id="shiftTable" class="densuke-table"></table></div></div>
  <div class="slot-legend" aria-label="時間帯"><span>① 8:00〜10:00</span><span>② 10:00〜12:00</span><span>③ 12:30〜14:15</span><span>④ 14:15〜16:00</span><span>○：出勤予定　×：出勤予定なし</span></div>

</div>

<script type="module">

import {
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


// ==================================
// Firebase設定
// ==================================

import { auth, db } from "./shared/firebase.js";
  import { getUserProfile } from "./shared/auth.js";
  import { mountAppShell } from "./shared/app-shell.js?v=20261120-10";


// ==================================
// 基本設定
// ==================================

let currentUserId = null;
let zoomScale = 100;

const weekSelector =
  document.getElementById("weekSelector");

const shiftTable =
  document.getElementById("shiftTable");

const statusMessage =
  document.getElementById("statusMessage");

const shifts = [
  { label: "8:00〜10:00", value: "8:00-10:00" },
  { label: "10:00〜12:00", value: "10:00-12:00" },
  { label: "12:30〜14:15", value: "12:30-14:15" },
  { label: "14:15〜16:00", value: "14:15-16:00" }
];

const dayLabels = [
  "月", "火", "水", "木", "金", "土", "日"
];


// ==================================
// 日付関連
// ==================================

function getISOWeekId(date) {

  const d = new Date(Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  ));

  d.setUTCDate(
    d.getUTCDate() + 4 - (d.getUTCDay() || 7)
  );

  const yearStart = new Date(
    Date.UTC(d.getUTCFullYear(), 0, 1)
  );

  const week = Math.ceil(
    (((d - yearStart) / 86400000) + 1) / 7
  );

  return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}


function getWeekDates(weekId) {

  const [year, week] = weekId.split("-W").map(Number);

  const jan4 = new Date(Date.UTC(year, 0, 4));

  const monday = new Date(jan4);

  monday.setUTCDate(
    jan4.getUTCDate()
    - ((jan4.getUTCDay() + 6) % 7)
    + (week - 1) * 7
  );

  return Array.from({ length: 7 }, (_, i) => {

    const d = new Date(monday);

    d.setUTCDate(monday.getUTCDate() + i);

    return new Date(
      d.getUTCFullYear(),
      d.getUTCMonth(),
      d.getUTCDate()
    );

  });
}


function dateToKey(date) {

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");

}


// ==================================
// ログイン確認
// ==================================

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUserId = user.uid;

    const profile = await getUserProfile(user);
    if (!profile) {
      window.location.replace("./index.html");
      return;
    }
    mountAppShell({ active: "attendance", profile, homeHref: "./home.html", logoutUrl: "./index.html", links: [
      { id: "home", label: "ホーム", href: "./home.html" },
      { id: "attendance", label: "出勤", href: "./employee_home.html" },
      { id: "learning", label: "学習", href: "./learning/index.html" },
      { id: "wood", label: "木材", href: "./wood/index.html" }
    ] });

  statusMessage.textContent =
    `${user.email} さんのシフト`;

  const currentWeek = getISOWeekId(new Date());

  const monday = getWeekDates(currentWeek)[0];
  weekSelector.value = dateToKey(monday);

  try {
    await loadShift(currentWeek);
  } catch (error) {
    console.error(error);
    statusMessage.textContent =
      "シフトの読み込みに失敗しました。";
  }

});


// ==================================
// シフト読み込み
// ==================================

async function loadShift(weekId) {

  if (!currentUserId || !weekId) return;

  statusMessage.textContent = "シフトを読み込み中...";

  shiftTable.innerHTML = "";

  const weekDates = getWeekDates(weekId);

  const startDate = weekDates[0];

  const endDate = new Date(weekDates[6]);

  endDate.setDate(endDate.getDate() + 1);


  document.getElementById("selectedWeekLabel").textContent =
    `${dateToKey(weekDates[0])} 〜 ${dateToKey(weekDates[4])}`;


  // 管理者ページと同じattendanceItemsを取得
  const attendanceQuery = query(
    collection(db, "attendanceItems"),
    where("userId", "==", currentUserId)
  );

  const snapshot = await getDocs(attendanceQuery);


  // 本人の出勤予定を整理
  const scheduledCells = new Set();

  snapshot.docs.forEach(docSnap => {

    const data = docSnap.data();

    if (data.userId !== currentUserId) return;

    if (data.state !== "出勤予定") return;

    if (!data.date || !data.shift) return;

    const itemDate = data.date.toDate();
    if (itemDate < startDate || itemDate >= endDate) return;
    const dateKey = dateToKey(itemDate);

    scheduledCells.add(
      `${dateKey}|${data.shift}`
    );

  });


  // 表を作成
  buildShiftTable(weekDates, scheduledCells);

  if (scheduledCells.size === 0) {
    statusMessage.textContent =
      "この週のシフトは登録されていません。";
  } else {
    statusMessage.textContent =
      "シフトを表示しています。";
  }

}


// ==================================
// シフト表作成
// ==================================

function buildShiftTable(weekDates, scheduledCells) {
  shiftTable.innerHTML = "";
  shiftTable.classList.add("densuke-table");
  const colgroup=document.createElement("colgroup");
  [112,82,130].forEach(width=>{const col=document.createElement("col");col.style.width=width+"px";colgroup.appendChild(col);});
  shiftTable.appendChild(colgroup);
  const thead=document.createElement("thead"),headerRow=document.createElement("tr");
  ["日付","時間帯","自分"].forEach(label=>{const th=document.createElement("th");th.textContent=label;headerRow.appendChild(th);});
  thead.appendChild(headerRow);shiftTable.appendChild(thead);
  const tbody=document.createElement("tbody");
  weekDates.slice(0,5).forEach((date,dayIndex)=>{
    const dateKey=dateToKey(date);
    shifts.forEach((shift,shiftIndex)=>{
      const row=document.createElement("tr");
      if(shiftIndex===0){const d=document.createElement("td");d.className="date-cell";d.rowSpan=4;d.textContent=(date.getMonth()+1)+"/"+date.getDate()+"（"+dayLabels[dayIndex]+"）";row.appendChild(d);}
      const slot=document.createElement("td");slot.className="slot-cell";slot.textContent=["①","②","③","④"][shiftIndex];slot.title=shift.label;row.appendChild(slot);
      const cell=document.createElement("td");cell.className="assignment-cell";
      const mark=document.createElement("span");
      if(scheduledCells.has(dateKey+"|"+shift.value)){mark.textContent="○";mark.className="scheduled-mark";mark.setAttribute("aria-label","出勤予定");}
      else{mark.textContent="×";mark.className="not-scheduled-mark";mark.setAttribute("aria-label","出勤予定なし");}
      cell.appendChild(mark);row.appendChild(cell);tbody.appendChild(row);
    });
  });
  shiftTable.appendChild(tbody);
}


// 週変更
// ==================================

weekSelector.addEventListener("change", async () => {
  if (!weekSelector.value) return;
  try {
    const [year,month,day]=weekSelector.value.split("-").map(Number);
    const weekId=getISOWeekId(new Date(year,month-1,day));
    weekSelector.value=dateToKey(getWeekDates(weekId)[0]);
    await loadShift(weekId);
  } catch(error) {
    console.error(error);
    statusMessage.textContent="シフトの読み込みに失敗しました。";
  }
});

// スマホは2本指ピンチ、PCはCtrl＋マウスホイールで倍率を変更。
function applyZoom(){document.getElementById("tableZoomContent").style.zoom=String(zoomScale*0.6/100);document.getElementById("zoomLabel").textContent=zoomScale+"%";}
const tableWrap=document.querySelector(".table-wrap");
let pinchStartDistance=0,pinchStartZoom=zoomScale;
function getTouchDistance(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy);}
tableWrap.addEventListener("touchstart",event=>{if(event.touches.length!==2)return;pinchStartDistance=getTouchDistance(event.touches);pinchStartZoom=zoomScale;},{passive:true});
tableWrap.addEventListener("touchmove",event=>{if(event.touches.length!==2||!pinchStartDistance)return;event.preventDefault();const ratio=getTouchDistance(event.touches)/pinchStartDistance;zoomScale=Math.max(100,Math.min(150,Math.round(pinchStartZoom*ratio)));applyZoom();},{passive:false});
function resetPinch(){pinchStartDistance=0;}
tableWrap.addEventListener("touchend",resetPinch,{passive:true});tableWrap.addEventListener("touchcancel",resetPinch,{passive:true});
tableWrap.addEventListener("wheel",event=>{if(!event.ctrlKey)return;event.preventDefault();zoomScale=Math.max(100,Math.min(150,zoomScale+(event.deltaY<0?5:-5)));applyZoom();},{passive:false});
document.getElementById("zoomReset").addEventListener("click",()=>{zoomScale=100;applyZoom();});
applyZoom();// ==================================
</script>

</body>
</html>
