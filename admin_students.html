<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>生徒名簿 - 管理者</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  th {
    background: #f0f0f0;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  #logoutBtn { background:#e24a4a; }
</style>
</head>

<body>
<div class="container">
  <h2>生徒名簿</h2>
  <p id="statusMessage">読み込み中...</p>

  <table id="studentsTable">
    <tr>
      <th>ID</th>
      <th>名前</th>
      <th>役割</th>
    </tr>
  </table>

  <a class="button" href="admin_home.html">管理者ホームへ戻る</a>
  <a class="button" id="logoutBtn">ログアウト</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getFirestore, collection, getDocs 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { 
    getAuth, onAuthStateChanged, signOut 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtBjVT9p1JlwLZhKRLzq5secW2YyD1U0U",
    authDomain: "attendance-system-eb7d1.firebaseapp.com",
    projectId: "attendance-system-eb7d1",
    storageBucket: "attendance-system-eb7d1.firebasestorage.app",
    messagingSenderId: "803269635846",
    appId: "1:803269635846:web:6e12018f4b2db2c0747887"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ログイン確認
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
    } else {
      loadStudents();
    }
  });

  // 生徒一覧読み込み
  async function loadStudents() {
    const table = document.getElementById("studentsTable");

    const snapshot = await getDocs(collection(db, "students"));

    if (snapshot.empty) {
      document.getElementById("statusMessage").textContent = "生徒が登録されていません";
      return;
    }

    document.getElementById("statusMessage").textContent = "";

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const id = docSnap.id; // ドキュメントID（student01 など）

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${id}</td>
        <td>${data.name}</td>
        <td>${data.role || "未設定"}</td>
      `;
      table.appendChild(row);
    });
  }

  // ログアウト
  document.getElementById("logoutBtn").onclick = () => {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  };
</script>

</body>
</html>
