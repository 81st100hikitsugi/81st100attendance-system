<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./shared/app-shell.css">
<title>通知作成 - 管理者</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  label { display:block; margin-top: 10px; }
  input, textarea, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  textarea { height: 120px; }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  #sendBtn { background:#4caf50; }
  
</style>
</head>

<body>
<div class="container">
  <h2>通知作成</h2>
  <p id="statusMessage">生徒一覧を読み込み中...</p>

  <label>タイトル</label>
  <input type="text" id="titleInput" placeholder="例：遅刻について">

  <label>本文</label>
  <textarea id="messageInput" placeholder="通知内容を入力してください"></textarea>

  <label>対象生徒</label>
  <select id="targetSelect">
    <option value="">選択してください</option>
  </select>

  <button class="button" id="sendBtn" type="button" disabled>通知を送信する</button>
</div>

<script type="module">
  import {collection,getDocs,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import {db} from "./shared/firebase.js";
  import {requireAdmin} from "./shared/auth.js";
  import {mountAppShell} from "./shared/app-shell.js";
  const $=id=>document.getElementById(id);
  const send=$("sendBtn");
  async function loadStudents(){
    const snapshot=await getDocs(collection(db,"students")),select=$("targetSelect");
    select.replaceChildren(new Option("選択してください",""));
    snapshot.docs.sort((a,b)=>(a.data().name||"").localeCompare(b.data().name||"","ja")).forEach(entry=>{
      const option=document.createElement("option");option.value=entry.id;option.textContent=entry.data().name||entry.id;select.append(option);
    });
    $("statusMessage").textContent="送信先を選択してください。";
  }
  requireAdmin({
    loginUrl:"./index.html",deniedUrl:"./home.html",
    onReady:async({profile})=>{
      mountAppShell({active:"attendance",profile,homeHref:"./home.html",logoutUrl:"./index.html",links:[
        {id:"home",label:"ホーム",href:"./home.html"},
        {id:"attendance",label:"出勤",href:"./employee_home.html"},
        {id:"learning",label:"学習",href:"./learning/index.html"},
        {id:"wood",label:"木材",href:"./wood/index.html"}
      ]});
      try{await loadStudents();send.disabled=false}catch(error){console.error(error);$("statusMessage").textContent="ユーザー一覧を読み込めませんでした。通信状態や権限を確認してください。"}
    },
    onError:error=>{$("statusMessage").textContent=error.message||"管理者権限を確認できませんでした。"}
  });
  send.addEventListener("click",async()=>{
    const title=$("titleInput").value.trim(),message=$("messageInput").value.trim(),target=$("targetSelect").value;
    if(!title||!message||!target){$("statusMessage").textContent="タイトル・本文・対象ユーザーをすべて入力してください。";return}
    send.disabled=true;$("statusMessage").textContent="送信中...";
    try{
      await addDoc(collection(db,"notifications"),{title,message,target,date:serverTimestamp()});
      $("statusMessage").textContent="通知を送信しました。";
      $("titleInput").value="";$("messageInput").value="";
    }catch(error){console.error(error);$("statusMessage").textContent="通知を送信できませんでした。通信状態やアクセス権限を確認してください。"}
    finally{send.disabled=false}
  });
</script>

</body>
</html>
