
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教科別ページ - 学習情報管理</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/subject.css">
</head>
<body>

  <header class="site-header">
    <div>
      <h1>学習情報管理</h1>
      <p>課題・小テストなどの学習情報を確認できます</p>
    </div>

    <div class="header-admin-area">
      <a
        id="adminLoginLink"
        class="admin-login-link"
        href="../admin/login.html"
      >管理者ログイン</a>

      <div id="adminMenu" hidden>
        <span>管理者メニュー</span>
        <button id="adminLogoutButton" type="button">
          ログアウト
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <a href="../index.html" id="backLink" class="back-link">＜ 戻る</a>

    <h2 id="subjectTitle" class="subject-title">教科名</h2>

    <section class="learning-section">
      <h2>学習関連情報</h2>

      <div class="filter-area">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="情報名で検索"
          aria-label="情報名で検索"
        >

        <div class="category-filters">
          <label>
            <input type="checkbox" id="filterSubmission" checked>
            提出物
          </label>

          <label>
            <input type="checkbox" id="filterTest" checked>
            小テスト
          </label>

          <label>
            <input type="checkbox" id="filterNone" checked>
            NONE
          </label>
        </div>

        <label class="expired-filter">
          <input type="checkbox" id="showExpired">
          期限切れを表示
        </label>
      </div>

      <div class="period-area">
        <label for="periodSelect">表示期間：</label>
        <select id="periodSelect">
          <option value="future">今日以降</option>
          <option value="today">今日</option>
          <option value="tomorrow">明日まで</option>
          <option value="week">今週</option>
          <option value="month">今月</option>
        </select>
      </div>

      <button id="addInfoButton" type="button" hidden>
        ＋ 情報を追加
      </button>

      <form id="addInfoForm" hidden>
        <h3>学習情報の追加</h3>

        <label for="newInfoName">情報名（必須）</label>
        <input type="text" id="newInfoName" required maxlength="100">

        <label for="newInfoCategory">分類</label>
        <select id="newInfoCategory">
          <option value="NONE">NONE</option>
          <option value="提出物">提出物</option>
          <option value="小テスト">小テスト</option>
        </select>

        <label for="newInfoNotes">備考</label>
        <textarea id="newInfoNotes" rows="4"></textarea>

        <label for="newInfoDueDate">期限（任意）</label>
        <input type="date" id="newInfoDueDate">

        <p id="addInfoError" hidden></p>

        <button type="submit" id="saveInfoButton">保存</button>
        <button type="button" id="cancelInfoButton">キャンセル</button>
      </form>

      <div id="learningInfoList" class="learning-info-list">
        <p class="empty-message">該当する情報はありません。</p>
      </div>
    </section>

    <section class="document-section">
      <h2>管理者用資料</h2>

      <!-- 資料の表示部分 -->
      <div id="documentContent" class="document-content">
        <p>資料はありません。</p>
      </div>

      <!-- 管理者専用：編集ボタン -->
      <button id="editDocumentButton" type="button" hidden>
        資料を編集
      </button>

      <!-- 管理者専用：編集画面 -->
      <div id="documentEditor" hidden>

        <div class="document-toolbar">
          <label for="documentHeading">見出し：</label>
          <select id="documentHeading">
            <option value="p">通常の文章</option>
            <option value="h2">見出し1</option>
            <option value="h3">見出し2</option>
            <option value="h4">見出し3</option>
          </select>

          <button type="button" id="documentBoldButton">
            太字
          </button>

          <label for="documentColor">文字色：</label>
          <input type="color" id="documentColor" value="#000000">

          <button type="button" id="documentColorButton">
            色を適用
          </button>

          <button type="button" id="documentBulletButton">
            箇条書き
          </button>

          <button type="button" id="documentNumberButton">
            番号付きリスト
          </button>

          <button type="button" id="documentLinkButton">
            リンク
          </button>
        </div>

        <div
          id="documentEditorArea"
          class="document-editor-area"
          contenteditable="true"
          role="textbox"
          aria-label="管理者用資料の編集欄"
          aria-multiline="true"
        ></div>

        <p id="documentError" hidden></p>

        <div class="document-editor-buttons">
          <button type="button" id="saveDocumentButton">
            保存
          </button>

          <button type="button" id="cancelDocumentButton">
            キャンセル
          </button>
        </div>

      </div>
    </section>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/subject.js"></script>

</body>
</html>
