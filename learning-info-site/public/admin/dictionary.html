
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辞書管理</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/dictionary.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>辞書管理</h1>
      <p>検索に使用する別表記を管理します</p>
    </div>
  </header>

  <main class="container">
    <p>
      <a href="../index.html">トップページへ戻る</a>
    </p>

    <section>
      <h2>辞書の登録</h2>

      <form id="dictionaryForm">
        <div>
          <label for="baseWord">基準ワード</label>
          <input
            type="text"
            id="baseWord"
            maxlength="100"
            required
            placeholder="例：テスト"
          >
        </div>

        <div>
          <label for="alternativeWords">別表記</label>
          <textarea
            id="alternativeWords"
            rows="3"
            placeholder="例：てすと、test"
          ></textarea>
          <p>複数ある場合は、読点（、）またはカンマ（,）で区切ってください。</p>
        </div>

        <p id="dictionaryError" hidden></p>

        <button type="submit" id="saveDictionaryButton">
          登録
        </button>
        <button type="button" id="cancelDictionaryButton" hidden>
          キャンセル
        </button>
      </form>
    </section>

    <section>
      <h2>登録済みの辞書</h2>
      <div id="dictionaryList">
        <p>読み込み中...</p>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/dictionary.js"></script>
</body>
</html>
