<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">
<title>ホーム - 出勤管理</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    text-align: center;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
  }
  #logoutBtn {
    background:#e24a4a;
  }
</style>
</head>

<body>
<div class="container">
  <h2 id="userName">ようこそ</h2>

  <a class="button" href="employee_attendance.html">出勤・退勤</a>
  <a class="button" href="employee_history.html">打刻履歴</a>
  <a class="button" href="employee_shift.html">シフト確認</a>
  <a class="button" href="employee_notifications.html">通知一覧</a>

  <a class="button" id="logoutBtn">ログアウト</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtBjVT9p1JlwLZhKRLzq5secW2YyD1U0U",
    authDomain: "attendance-system-eb7d1.firebaseapp.com",
    projectId: "attendance-system-eb7d1",
    storageBucket: "attendance-system-eb7d1.firebasestorage.app",
    messagingSenderId: "803269635846",
    appId: "1:803269635846:web:6e12018f4b2db2c0747887"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ログイン確認
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    // Firestore から名前を取得（UIDで1対1）
    const userDoc = await getDoc(doc(db, "students", user.uid));

    if (userDoc.exists()) {
      const data = userDoc.data();
      document.getElementById("userName").textContent = `ようこそ、${data.name} さん`;
    } else {
      // 生徒として登録されていない場合はメールを表示
      document.getElementById("userName").textContent = `ようこそ、${user.email} さん`;
    }
  });

  // ログアウト
  document.getElementById("logoutBtn").onclick = () => {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  };
</script>

</body>
</html>
