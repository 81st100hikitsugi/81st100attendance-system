<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2878c8">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./shared/app-shell.css?v=20261120-8">
  <title>出勤管理 - 業務管理</title>
  <style>
    * { box-sizing: border-box; }
    body { color: #202833; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 28px auto 48px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 4vw, 1.9rem); }
    .lead { margin: 0 0 22px; color: #667085; }
    .menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .menu a {
      display: flex; min-height: 104px; flex-direction: column; justify-content: center;
      padding: 18px; border: 1px solid #e1e6ed; border-radius: 14px;
      background: #fff; color: #202833; text-decoration: none;
      box-shadow: 0 2px 8px #172b4d0a;
    }
    .menu a:hover { border-color: #2878c8; background: #f8fbff; }
    .menu strong { margin-bottom: 6px; color: #2469ad; font-size: 1.05rem; }
    .menu span { color: #667085; font-size: .88rem; }
    .admin-link { display: none; }
    .error { padding: 14px; border-radius: 10px; background: #fff4e5; color: #8a4b08; }
    @media (max-width: 560px) { main { margin-top: 22px; } .menu { grid-template-columns: 1fr; } .menu a { min-height: 84px; } }
  </style>
<meta name="robots" content="noindex, nofollow">
</head>
<body class="app-shell-pending">
  <main>
    <h1>出勤管理</h1>
    <p class="lead">利用する機能を選択してください。</p>
    <nav class="menu" aria-label="出勤管理メニュー">
      <a href="./employee_attendance.html">
        <strong>出勤・退勤</strong>
        <span>今日の出勤・退勤を記録します</span>
      </a>
      <a href="./employee_history.html">
        <strong>打刻履歴</strong>
        <span>これまでの打刻記録を確認します</span>
      </a>
      <a href="./employee_shift.html">
        <strong>シフト確認</strong>
        <span>週ごとの自分のシフトを確認します</span>
      </a>
      <a href="./employee_notifications.html">
        <strong>通知一覧</strong>
        <span>お知らせを確認します</span>
      </a>
      <a class="admin-link" id="adminLink" href="./admin_home.html">
        <strong>管理者メニュー</strong>
        <span>出勤管理の管理機能を開きます</span>
      </a>
    </nav>
    <p id="statusMessage" role="status" class="lead" aria-live="polite">ユーザー情報を確認しています...</p>
  </main>

  <script type="module">
    import { requireUser } from "./shared/auth.js";
    import { mountAppShell } from "./shared/app-shell.js?v=20261120-8";

    requireUser({
      loginUrl: "./index.html",
      onReady: ({ profile }) => {
        mountAppShell({
          active: "attendance",
          profile,
          homeHref: "./home.html",
          logoutUrl: "./index.html",
          links: [
            { id: "home", label: "ホーム", href: "./home.html" },
            { id: "attendance", label: "出勤", href: "./employee_home.html" },
            { id: "learning", label: "学習", href: "./learning/index.html" },
            { id: "wood", label: "木材", href: "./wood/index.html" }
          ]
        });
        if (profile.isAdmin === true) {
          document.getElementById("adminLink").style.display = "flex";
        }
        document.getElementById("statusMessage").textContent = "";
      },
      onError: (error) => {
        console.error("ユーザー情報の確認に失敗しました:", error);
        document.getElementById("statusMessage").textContent =
          "ユーザー情報を確認できませんでした。管理者にお問い合わせください。";
      }
    });
  </script>
</body>
</html>
