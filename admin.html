<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者画面 - 出勤管理</title>
  <link rel="stylesheet" href="style.css" />
<meta name="robots" content="noindex, nofollow">
<meta name="robots" content="noindex, nofollow">
</head>

<body>
  <div class="container">
    <h1>管理者画面</h1>
    <h2>出勤・退勤記録一覧</h2>

    <div id="records"></div>

    <p id="message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtBjVT9p1JlwLZhKRLzq5secW2YyD1U0U",
      authDomain: "attendance-system-eb7d1.firebaseapp.com",
      projectId: "attendance-system-eb7d1",
      storageBucket: "attendance-system-eb7d1.firebasestorage.app",
      messagingSenderId: "803269635846",
      appId: "1:803269635846:web:6e12018f4b2db2c0747887"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        loadRecords();
      }
    });

    async function loadRecords() {
      const recordsDiv = document.getElementById("records");
      recordsDiv.innerHTML = "<p>読み込み中...</p>";

      // ★ 修正：attendanceItems を読み込む
      const querySnapshot = await getDocs(collection(db, "attendanceItems"));

      let html = "<ul>";

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const time = data.time ?? "時間不明";
        html += `<li>${data.userId}：${data.state}（${time}）</li>`;
      });

      html += "</ul>";

      recordsDiv.innerHTML = html;
    }
  </script>
</body>
</html>
