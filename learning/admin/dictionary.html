<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173B57"><title>検索辞書管理</title><link rel="stylesheet" href="../../shared/app-shell.css"><link rel="stylesheet" href="../css/learning.css"></head><body><main class="learning-container"><p><a href="../index.html">＜ 学習情報一覧へ戻る</a></p><header class="learning-heading"><h1>検索辞書管理</h1><p>検索時に同じ意味として扱う別表記を登録します。</p></header><section class="learning-section"><h2>辞書の登録・編集</h2><form id="dictionaryForm"><label>基準ワード<input id="baseWord" maxlength="100" required placeholder="例：テスト"></label><label>別表記<textarea id="alternativeWords" rows="3" placeholder="例：てすと、test"></textarea></label><p>複数ある場合は、読点（、）またはカンマ（,）で区切ってください。</p><p id="dictionaryError" class="learning-status" role="alert"></p><button id="saveDictionaryButton" type="submit">登録</button><button id="cancelDictionaryButton" type="button" hidden>キャンセル</button></form></section><section class="learning-section"><h2>登録済みの辞書</h2><div id="dictionaryList">読み込み中...</div></section><p id="dictionaryStatus" class="learning-status" role="status"></p></main><script type="module" src="../js/dictionary.js"></script></body></html>
