<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173B57">
<title>辞書管理</title>
<link rel="stylesheet" href="../../shared/app-shell.css?v=20261120-1">
<link rel="stylesheet" href="../css/learning.css?v=20261120-1">
<link rel="stylesheet" href="../../learning-info-site/public/css/common.css">
<link rel="stylesheet" href="../../learning-info-site/public/css/dictionary.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<header class="site-header">
  <div>
    <h1>辞書管理</h1>
    <p>検索に使用する別表記を管理します</p>
  </div>
</header>
<main class="container learning-container">
  <p><a href="../index.html">トップページへ戻る</a></p>
  <section>
    <h2>辞書の登録</h2>
    <form id="dictionaryForm">
      <div>
        <label for="baseWord">基準ワード</label>
        <input type="text" id="baseWord" maxlength="100" required placeholder="例：テスト">
      </div>
      <div>
        <label for="alternativeWords">別表記</label>
        <textarea id="alternativeWords" rows="3" placeholder="例：てすと、test"></textarea>
        <p>複数ある場合は、読点（、）またはカンマ（,）で区切ってください。</p>
      </div>
      <p id="dictionaryError" hidden></p>
      <button type="submit" id="saveDictionaryButton">登録</button>
      <button type="button" id="cancelDictionaryButton" hidden>キャンセル</button>
    </form>
  </section>
  <section>
    <h2>登録済みの辞書</h2>
    <div id="dictionaryList"><p>読み込み中...</p></div>
  </section>
  <p id="dictionaryStatus" class="learning-status" role="status"></p>
</main>
<script type="module" src="../js/dictionary.js?v=20261120-1"></script>
</body>
</html>
