<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>検索辞書管理</title><link rel="stylesheet" href="../learning.css"></head><body><header class="page-heading"><h1>検索辞書管理</h1><p>検索に使用する別表記を管理します</p></header><main class="container"><a href="../index.html" class="back-link">＜ 学習情報一覧へ戻る</a><section class="panel"><h2>辞書の登録</h2><form id="dictionaryForm" class="editor-form"><label>基準ワード<input id="baseWord" maxlength="100" required placeholder="例：テスト"></label><label>別表記<textarea id="alternativeWords" rows="3" placeholder="例：てすと、test"></textarea></label><p>複数ある場合は、読点（、）またはカンマ（,）で区切ってください。</p><p id="dictionaryError" class="error" hidden></p><button type="submit" id="saveDictionaryButton">登録</button><button type="button" id="cancelDictionaryButton" hidden>キャンセル</button></form></section><section class="panel"><h2>登録済みの辞書</h2><div id="dictionaryList">読み込み中...</div></section></main><script type="module" src="./dictionary.js"></script></body></html>
