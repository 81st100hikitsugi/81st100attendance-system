<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173B57">
<title>教科別学習情報</title>
<link rel="stylesheet" href="../../shared/app-shell.css?v=20261120-2">
<link rel="stylesheet" href="../css/learning.css?v=20261120-5">
<link rel="stylesheet" href="../../learning-info-site/public/css/subject.css?v=20261120-3">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<main class="learning-container">
  <div class="learning-page-title"><h1>学習情報管理</h1><p>課題・小テストなどの学習情報を確認できます</p></div>
  <p class="subject-page-links">
    
    <span id="dictionaryAdminLink" hidden> ｜ <a href="../admin/dictionary.html">検索辞書を管理</a> ｜ <a href="../admin/migrate.html">旧データを移行</a></span>
  </p>
  <h2 id="subjectTitle" class="subject-title">教科別学習情報</h2>

  <section class="learning-section">
    <h2>学習関連情報</h2>
    <div class="filter-area">
      <input id="searchInput" class="search-input" type="search" placeholder="情報名で検索" aria-label="情報名で検索">
      <div class="category-filters">
        <label><input id="filterSubmission" type="checkbox" checked> 提出物</label>
        <label><input id="filterTest" type="checkbox" checked> 小テスト</label>
        <label><input id="filterNone" type="checkbox" checked> NONE</label>
      </div>
      <label class="expired-filter"><input id="showExpired" type="checkbox"> 期限切れを表示</label>
    </div>
    <div class="period-area">
      <label for="periodSelect">表示期間：</label>
      <select id="periodSelect">
        <option value="future">今日以降</option>
        <option value="today">今日</option>
        <option value="tomorrow">明日まで</option>
        <option value="week">今週</option>
        <option value="month">今月</option>
      </select>
    </div>

    <button id="addInfoButton" type="button" hidden>＋ 情報を追加</button>
    <form id="addInfoForm" hidden>
      <h3 id="infoDialogTitle">学習情報の追加</h3>
      <label for="infoName">情報名（必須）</label>
      <input type="text" id="infoName" required maxlength="200">
      <label for="infoCategory">分類</label>
      <select id="infoCategory">
        <option value="NONE">NONE</option>
        <option value="提出物">提出物</option>
        <option value="小テスト">小テスト</option>
      </select>
      <label for="infoNotes">備考</label>
      <textarea id="infoNotes" rows="4"></textarea>
      <label for="infoDueDate">期限（任意）</label>
      <input type="date" id="infoDueDate">
      <p id="infoError" class="learning-status" role="alert" hidden></p>
      <button type="submit" id="saveInfoButton">保存</button>
      <button type="button" id="cancelInfoButton">キャンセル</button>
    </form>

    <div id="learningInfoList" class="learning-info-list">
      <p class="empty-message">読み込み中...</p>
    </div>
  </section>

  <section class="learning-section document-section">
    <h2>管理者用資料</h2>
    <div id="documentAdminTools" hidden>
      <button id="editDocumentButton" type="button">資料を編集</button>
    </div>
    <div id="documentContent" class="document-content">読み込み中...</div>
    <section id="documentEditor" hidden>
      <h3>資料の編集</h3>
      <div class="editor-toolbar">
        <label for="documentHeading">見出し：</label>
        <select id="documentHeading" aria-label="段落形式">
          <option value="P">通常の文章</option>
          <option value="H2">見出し1</option>
          <option value="H3">見出し2</option>
          <option value="H4">見出し3</option>
        </select>
        <button id="documentBoldButton" type="button">太字</button>
        <label for="documentColor">文字色：</label>
        <input id="documentColor" type="color" value="#000000" aria-label="文字色">
        <button id="documentColorButton" type="button">色を適用</button>
        <button id="documentBulletButton" type="button">箇条書き</button>
        <button id="documentNumberButton" type="button">番号付きリスト</button>
        <button id="documentLinkButton" type="button">リンク</button>
      </div>
      <div id="documentEditorArea" class="document-editor-area" contenteditable="true" role="textbox" aria-label="管理者用資料の編集欄" aria-multiline="true"></div>
      <p id="documentError" class="learning-status" role="alert"></p>
      <div class="document-editor-buttons">
        <button id="saveDocumentButton" type="button">保存</button>
        <button id="cancelDocumentButton" type="button">キャンセル</button>
      </div>
    </section>
  </section>
  <p id="learningStatus" class="learning-status" role="status"></p>
</main>
<script type="module" src="../js/subject.js?v=20261120-2"></script>
</body>
</html>
