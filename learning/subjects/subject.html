<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173B57"><title>教科別学習情報</title><link rel="stylesheet" href="../../shared/app-shell.css"><link rel="stylesheet" href="../css/learning.css"></head>
<body><main class="learning-container"><p><a href="../index.html">＜ 学習情報一覧へ戻る</a></p><header class="learning-heading"><h1 id="subjectTitle">教科別学習情報</h1><p>この教科の課題・小テスト・資料を確認できます。</p></header>
<section class="learning-section"><h2>学習関連情報</h2><div class="filter-area"><input id="searchInput" class="search-input" type="search" placeholder="情報名で検索" aria-label="情報名で検索"><div class="category-filters"><label><input id="filterSubmission" type="checkbox" checked> 提出物</label><label><input id="filterTest" type="checkbox" checked> 小テスト</label><label><input id="filterNone" type="checkbox" checked> NONE</label></div><label class="expired-filter"><input id="showExpired" type="checkbox"> 期限切れを表示</label></div><div class="period-area"><label for="periodSelect">表示期間：</label><select id="periodSelect"><option value="future">今日以降</option><option value="today">今日</option><option value="tomorrow">明日まで</option><option value="week">今週</option><option value="month">今月</option></select></div><div id="learningInfoList" class="learning-info-list"><p class="empty-message">読み込み中...</p></div></section>
<section class="learning-section"><h2>教科資料</h2><div id="documentContent" class="document-content">読み込み中...</div></section><p id="learningStatus" class="learning-status" role="status"></p></main><script type="module" src="../js/subject.js"></script></body></html>
