<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173B57"><title>教科別学習情報</title><link rel="stylesheet" href="../../shared/app-shell.css"><link rel="stylesheet" href="../css/learning.css"></head>
<body><main class="learning-container"><p><a href="../index.html">＜ 学習情報一覧へ戻る</a> <span id="dictionaryAdminLink" hidden>｜ <a href="../admin/dictionary.html">検索辞書を管理</a> ｜ <a href="../admin/migrate.html">旧データを移行</a></span></p><header class="learning-heading"><h1 id="subjectTitle">教科別学習情報</h1><p>この教科の課題・小テスト・資料を確認できます。</p></header>
<section class="learning-section" id="adminInfoTools" hidden><h2>管理者メニュー</h2><button id="addInfoButton" type="button">＋ 情報を追加</button></section>
<section class="learning-section"><h2>学習関連情報</h2><div class="filter-area"><input id="searchInput" class="search-input" type="search" placeholder="情報名で検索" aria-label="情報名で検索"><div class="category-filters"><label><input id="filterSubmission" type="checkbox" checked> 提出物</label><label><input id="filterTest" type="checkbox" checked> 小テスト</label><label><input id="filterNone" type="checkbox" checked> NONE</label></div><label class="expired-filter"><input id="showExpired" type="checkbox"> 期限切れを表示</label></div><div class="period-area"><label for="periodSelect">表示期間：</label><select id="periodSelect"><option value="future">今日以降</option><option value="today">今日</option><option value="tomorrow">明日まで</option><option value="week">今週</option><option value="month">今月</option></select></div><div id="learningInfoList" class="learning-info-list"><p class="empty-message">読み込み中...</p></div></section>
<section class="learning-section"><h2>教科資料</h2><div id="documentAdminTools" hidden><button id="editDocumentButton" type="button">資料を編集</button></div><div id="documentContent" class="document-content">読み込み中...</div><section id="documentEditor" hidden><h3>資料の編集</h3><div class="editor-toolbar"><select id="documentHeading" aria-label="段落形式"><option value="P">本文</option><option value="H2">見出し2</option><option value="H3">見出し3</option><option value="H4">見出し4</option></select><button id="documentBoldButton" type="button">太字</button><input id="documentColor" type="color" value="#000000" aria-label="文字色"><button id="documentColorButton" type="button">文字色</button><button id="documentBulletButton" type="button">箇条書き</button><button id="documentNumberButton" type="button">番号付き</button><button id="documentLinkButton" type="button">リンク</button></div><div id="documentEditorArea" class="document-content" contenteditable="true" role="textbox" aria-multiline="true"></div><p id="documentError" class="learning-status" role="alert"></p><button id="saveDocumentButton" type="button">資料を保存</button><button id="cancelDocumentButton" type="button">キャンセル</button></section></section>
<p id="learningStatus" class="learning-status" role="status"></p></main>
<dialog id="infoDialog"><form id="infoForm" method="dialog"><h2 id="infoDialogTitle">学習情報を追加</h2><label>情報名<input id="infoName" maxlength="200" required></label><label>分類<select id="infoCategory"><option value="NONE">NONE</option><option value="提出物">提出物</option><option value="小テスト">小テスト</option></select></label><label>期限<input id="infoDueDate" type="date"></label><label>備考<textarea id="infoNotes" rows="4"></textarea></label><p id="infoError" class="learning-status" role="alert"></p><button id="saveInfoButton" type="submit">保存</button><button id="cancelInfoButton" type="button">キャンセル</button></form></dialog>
<script type="module" src="../js/subject.js"></script></body></html>
