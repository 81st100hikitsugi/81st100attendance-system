<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2878c8"><title>全体作業予定の管理</title><link rel="stylesheet" href="./shared/app-shell.css?v=20261120-11">
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#202833;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(980px,calc(100% - 28px));margin:24px auto 80px}.panel{background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:650;font-size:.88rem;color:#526174}.field input,.field textarea{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.wide{grid-column:1/-1}button{border:0;border-radius:8px;padding:10px 14px;background:#2878c8;color:white;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#e9eef5;color:#334155}button.danger{background:#b93838}button:disabled{opacity:.5}.plan{padding:14px 0;border-bottom:1px solid #edf0f4}.plan:last-child{border-bottom:0}.plan h3{margin:0 0 5px}.muted{color:#667085}.actions{display:flex;gap:7px;margin-top:9px}.status{min-height:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style><meta name="robots" content="noindex, nofollow">
<meta name="robots" content="noindex, nofollow">
</head>
<body class="app-shell-pending"><main>
<header><h1>全体作業予定の管理</h1><p class="muted">ホーム画面に表示する日ごとの全体作業内容を登録・編集します。</p></header>
<section class="panel"><h2 id="formTitle">作業予定を登録</h2><form id="planForm"><input type="hidden" id="planId"><div class="grid">
<div class="field"><label for="planDate">日付</label><input id="planDate" type="date" required></div>
<div class="field"><label for="planTitle">作業名</label><input id="planTitle" maxlength="120" required></div>
<div class="field"><label for="startTime">開始時刻</label><input id="startTime" type="time"></div>
<div class="field"><label for="endTime">終了時刻</label><input id="endTime" type="time"></div>
<div class="field wide"><label for="description">内容・連絡事項</label><textarea id="description" rows="4" maxlength="2000"></textarea></div>
</div><div class="actions"><button id="savePlan" type="submit">保存</button><button id="cancelEdit" class="secondary" type="button" hidden>編集をキャンセル</button></div></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2>登録済みの予定</h2><label>表示日 <input id="filterDate" type="date"></label></div><div id="planList">読み込み中...</div></section>
<p id="status" class="status" role="status"></p></main>
<script type="module">
import {collection,getDocs,getDocsFromCache,doc,addDoc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {db,persistenceReady} from "./shared/firebase.js";import {requireAdmin} from "./shared/auth.js";import {mountAppShell} from "./shared/app-shell.js?v=20261120-10";
const $=id=>document.getElementById(id);let user=null,plans=[],online=navigator.onLine;
const todayKey=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
const keyOf=v=>{const d=typeof v?.toDate==="function"?v.toDate():new Date(v);return Number.isNaN(d.getTime())?"":[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
const dateOf=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const status=(s,error=false)=>{$("status").textContent=s;$("status").style.color=error?"#b93838":"#526174"};
function reset(){ $("planForm").reset();$("planId").value="";$("planDate").value=$("filterDate").value||todayKey();$("formTitle").textContent="作業予定を登録";$("savePlan").textContent="保存";$("cancelEdit").hidden=true}
async function readDocs(ref){try{return await getDocs(ref)}catch(error){if(!navigator.onLine)return await getDocsFromCache(ref);throw error}}
async function load(){try{await persistenceReady;const snap=await readDocs(collection(db,"dailyWorkPlans"));plans=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>keyOf(a.date).localeCompare(keyOf(b.date))||String(a.startTime||"").localeCompare(String(b.startTime||"")));render()}catch(e){console.error(e);status("作業予定を読み込めませんでした。",true)}}
function render(){const target=$("planList"),day=$("filterDate").value;target.replaceChildren();const rows=plans.filter(p=>!day||keyOf(p.date)===day);if(!rows.length){target.textContent="この日に登録された予定はありません。";return}for(const p of rows){const card=document.createElement("article");card.className="plan";const h=document.createElement("h3");h.textContent=p.title||"作業予定";const meta=document.createElement("div");meta.className="muted";meta.textContent=[keyOf(p.date),[p.startTime,p.endTime].filter(Boolean).join("〜")].filter(Boolean).join(" / ");const desc=document.createElement("p");desc.textContent=p.description||"";const actions=document.createElement("div");actions.className="actions";const edit=document.createElement("button");edit.disabled=!online;edit.className="secondary";edit.textContent="編集";edit.onclick=()=>editPlan(p);const del=document.createElement("button");del.disabled=!online;del.className="danger";del.textContent="削除";del.onclick=()=>removePlan(p);actions.append(edit,del);card.append(h,meta,desc,actions);target.append(card)}}
function editPlan(p){if(!online)return;$("planId").value=p.id;$("planDate").value=keyOf(p.date);$("planTitle").value=p.title||"";$("startTime").value=p.startTime||"";$("endTime").value=p.endTime||"";$("description").value=p.description||"";$("formTitle").textContent="作業予定を編集";$("savePlan").textContent="更新";$("cancelEdit").hidden=false;window.scrollTo({top:0,behavior:"smooth"})}
async function removePlan(p){if(!online||!confirm("「"+p.title+"」を削除しますか？"))return;try{await deleteDoc(doc(db,"dailyWorkPlans",p.id));await load();status("作業予定を削除しました。")}catch(e){console.error(e);status("削除できませんでした。",true)}}
$("planForm").addEventListener("submit",async e=>{e.preventDefault();if(!online){status("オフライン中は閲覧のみ利用できます。",true);return}const b=$("savePlan");b.disabled=true;try{const id=$("planId").value,data={date:dateOf($("planDate").value),title:$("planTitle").value.trim(),startTime:$("startTime").value,endTime:$("endTime").value,description:$("description").value.trim(),updatedBy:user.uid,updatedAt:serverTimestamp()};if(!data.title)throw new Error("作業名を入力してください。");if(data.startTime&&data.endTime&&data.endTime<data.startTime)throw new Error("終了時刻は開始時刻以降にしてください。");if(id)await updateDoc(doc(db,"dailyWorkPlans",id),data);else await addDoc(collection(db,"dailyWorkPlans"),{...data,createdBy:user.uid,createdAt:serverTimestamp()});reset();await load();status("作業予定を保存しました。")}catch(e){console.error(e);status(e.message||"保存に失敗しました。",true)}finally{b.disabled=false}});
function updateConnectionState(){online=navigator.onLine;$("savePlan").disabled=!online;document.querySelectorAll("#planForm input,#planForm textarea").forEach(el=>el.disabled=!online);document.querySelectorAll(".plan button").forEach(el=>el.disabled=!online);if(!online)status("オフライン中のため閲覧のみ利用できます。");else if($("status").textContent==="オフライン中のため閲覧のみ利用できます。")status("オンラインに復帰しました。")}
window.addEventListener("online",updateConnectionState);window.addEventListener("offline",updateConnectionState);
$("cancelEdit").addEventListener("click",reset);$("filterDate").addEventListener("change",render);$("filterDate").value=todayKey();$("planDate").value=todayKey();
requireAdmin({loginUrl:"./index.html",deniedUrl:"./home.html",onReady:async({user:u,profile})=>{user=u;mountAppShell({active:"home",profile,homeHref:"./home.html",logoutUrl:"./index.html",links:[{id:"home",label:"ホーム",href:"./home.html"},{id:"attendance",label:"出勤",href:"./employee_home.html"},{id:"learning",label:"学習",href:"./learning/index.html"},{id:"wood",label:"木材",href:"./wood/index.html"}]});updateConnectionState();await load()},onError:e=>status(e.message,true)});
</script></body></html>
