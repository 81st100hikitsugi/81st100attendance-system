<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>通知一覧 - 生徒用</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 450px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  ul { padding-left: 0; }
  li {
    list-style: none;
    background: #fafafa;
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
  }
  .title {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .date {
    font-size: 12px;
    color: #666;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  #logoutBtn { background:#e24a4a; }
</style>
</head>

<body>
<div class="container">
  <h2 id="userName">通知一覧</h2>
  <p id="statusMessage">読み込み中...</p>

  <ul id="notificationList"></ul>

  <a class="button" href="employee_home.html">ホームへ戻る</a>
  <a class="button" id="logoutBtn">ログアウト</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getFirestore, collection, query, where, orderBy, getDocs, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { 
    getAuth, onAuthStateChanged, signOut 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtBjVT9p1JlwLZhKRLzq5secW2YyD1U0U",
    authDomain: "attendance-system-eb7d1.firebaseapp.com",
    projectId: "attendance-system-eb7d1",
    storageBucket: "attendance-system-eb7d1.firebasestorage.app",
    messagingSenderId: "803269635846",
    appId: "1:803269635846:web:6e12018f4b2db2c0747887"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUserId = null;

  // ログイン確認＋名前取得
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    currentUserId = user.uid;

    // Firestore から名前を取得
    const userDoc = await getDoc(doc(db, "students", user.uid));

    if (userDoc.exists()) {
      const data = userDoc.data();
      document.getElementById("userName").textContent = `ようこそ、${data.name} さん`;
      document.getElementById("statusMessage").textContent = `${data.name} さんの通知`;
    } else {
      document.getElementById("userName").textContent = `ようこそ、${user.email} さん`;
      document.getElementById("statusMessage").textContent = `${user.email} さんの通知`;
    }

    loadNotifications();
  });

  // 通知読み込み
  async function loadNotifications() {
    const list = document.getElementById("notificationList");
    list.innerHTML = "";

    const q = query(
      collection(db, "notifications"),
      where("target", "==", currentUserId),
      orderBy("date", "desc")
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      list.innerHTML = "<li>通知はありません</li>";
      return;
    }

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const li = document.createElement("li");

      const date = data.date?.toDate().toLocaleString("ja-JP") ?? "日時不明";

      li.innerHTML = `
        <div class="title">${data.title}</div>
        <div>${data.message}</div>
        <div class="date">${date}</div>
      `;

      list.appendChild(li);
    });
  }

  // ログアウト
  document.getElementById("logoutBtn").onclick = () => {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  };
</script>

</body>
</html>
