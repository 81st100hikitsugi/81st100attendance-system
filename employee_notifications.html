<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./shared/app-shell.css">
<title>通知一覧 - 生徒用</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 450px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  ul { padding-left: 0; }
  li {
    list-style: none;
    background: #fafafa;
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
  }
  .title {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .date {
    font-size: 12px;
    color: #666;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  #logoutBtn { background:#e24a4a; }
</style>
</head>

<body>
<div class="container">
  <h2 id="userName">通知一覧</h2>
  <p id="statusMessage">読み込み中...</p>

  <ul id="notificationList"></ul>
</div>

<script type="module">
  import {collection,query,where,orderBy,getDocs,getDocsFromCache,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import {db,persistenceReady} from "./shared/firebase.js";
  import {requireUser} from "./shared/auth.js";
  import {mountAppShell} from "./shared/app-shell.js";

  const $=id=>document.getElementById(id);
  function showError(message){$("statusMessage").textContent=message}
  function formatDate(value){
    if(!value)return "日時不明";
    const date=typeof value.toDate==="function"?value.toDate():new Date(value);
    return Number.isNaN(date.getTime())?"日時不明":date.toLocaleString("ja-JP");
  }
  async function readNotifications(ref){
    try{return await getDocs(ref)}
    catch(error){if(!navigator.onLine)return await getDocsFromCache(ref);throw error}
  }
  async function loadNotifications(uid){
    const list=$("notificationList");
    list.replaceChildren();
    try{
      await persistenceReady;
      const q=query(collection(db,"notifications"),where("target","==",uid),orderBy("date","desc"));
      const snapshot=await readNotifications(q);
      if(snapshot.empty){const li=document.createElement("li");li.textContent="通知はありません";list.append(li);return}
      for(const entry of snapshot.docs){
        const data=entry.data(),li=document.createElement("li");
        const title=document.createElement("div");title.className="title";title.textContent=data.title||"（タイトルなし）";
        const message=document.createElement("div");message.textContent=data.message||"";
        const date=document.createElement("div");date.className="date";date.textContent=formatDate(data.date);
        li.append(title,message,date);list.append(li);
      }
      showError(navigator.onLine?"":"オフラインの保存データを表示しています。");
    }catch(error){
      console.error(error);
      showError("通知を読み込めませんでした。通信状態またはアクセス権限を確認してください。");
    }
  }
  requireUser({
    loginUrl:"./index.html",
    onReady:async({user,profile})=>{
      mountAppShell({active:"attendance",profile,homeHref:"./home.html",logoutUrl:"./index.html",links:[
        {id:"home",label:"ホーム",href:"./home.html"},
        {id:"attendance",label:"出勤",href:"./employee_home.html"},
        {id:"learning",label:"学習",href:"./learning/index.html"},
        {id:"wood",label:"木材",href:"./wood/index.html"}
      ]});
      const name=profile?.name||user.email||"ユーザー";
      $("userName").textContent="ようこそ、"+name+" さん";
      showError(name+" さんの通知");
      await loadNotifications(user.uid);
    },
    onError:()=>showError("ユーザー情報を確認できませんでした。")
  });
</script>

</body>
</html>
