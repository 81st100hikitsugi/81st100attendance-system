<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2878c8">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./shared/app-shell.css?v=20261120-7">
  <title>管理者メニュー - 業務管理</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #202833; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f7fa; }
    main { width: min(920px, calc(100% - 32px)); margin: 28px auto 48px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.45rem, 4vw, 1.9rem); }
    .lead { margin: 0 0 24px; color: #667085; }
    .section { margin-top: 26px; }
    .section h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .menu a { display: flex; flex-direction: column; justify-content: center; min-height: 88px; padding: 17px; border: 1px solid #e1e6ed; border-radius: 13px; background: #fff; color: #202833; text-decoration: none; box-shadow: 0 2px 8px #172b4d0a; }
    .menu a:hover { border-color: #2878c8; background: #f8fbff; }
    .menu strong { margin-bottom: 5px; color: #2469ad; }
    .menu span { color: #667085; font-size: .88rem; }
    #adminName { color: #667085; font-size: .9rem; }
    @media (max-width: 560px) { main { margin-top: 22px; } .menu { grid-template-columns: 1fr; } .menu a { min-height: 76px; } }
  </style>
<meta name="robots" content="noindex, nofollow">
<meta name="robots" content="noindex, nofollow">
</head>
<body class="app-shell-pending">
  <main>
    <h1>管理者メニュー</h1>
    <p id="adminName" class="lead">管理者情報を確認しています...</p>

    <section class="section" aria-labelledby="employeeFunctions">
      <h2 id="employeeFunctions">従業員機能</h2>
      <nav class="menu" aria-label="従業員機能">
        <a href="./employee_attendance.html"><strong>出勤・退勤</strong><span>自分の出勤・退勤を記録</span></a>
        <a href="./employee_history.html"><strong>打刻履歴</strong><span>自分の打刻記録を確認</span></a>
        <a href="./employee_shift.html"><strong>シフト確認</strong><span>自分のシフトを確認</span></a>
        <a href="./employee_notifications.html"><strong>通知一覧</strong><span>受信したお知らせを確認</span></a>
      </nav>
    </section>

    <section class="section" aria-labelledby="adminFunctions">
      <h2 id="adminFunctions">管理者機能</h2>
      <nav class="menu" aria-label="管理者機能">
        <a href="./admin_students.html"><strong>ユーザー名簿</strong><span>登録ユーザーと役職を確認</span></a>
        <a href="./admin_shift_create.html"><strong>週シフト作成</strong><span>週ごとのシフトを作成・編集</span></a>
        <a href="./admin_notifications_create.html"><strong>通知作成</strong><span>ユーザーへお知らせを送信</span></a>
        <a href="./tablet.html"><strong>タブレット打刻</strong><span>5つの方式を切り替えて出勤・退勤を記録</span></a>
        <a href="./admin_shift_attendance_all.html"><strong>全員の打刻履歴</strong><span>全ユーザーの記録を確認</span></a>
        <a href="./admin_late_early.html"><strong>遅刻・早退確認</strong><span>遅刻・早退の状況を確認</span></a>
      </nav>
    </section>
  </main>

  <script type="module">
    import { requireAdmin } from "./shared/auth.js";
    import { mountAppShell } from "./shared/app-shell.js";

    requireAdmin({
      loginUrl: "./index.html",
      deniedUrl: "./employee_home.html",
      onReady: ({ profile }) => {
        document.getElementById("adminName").textContent =
          profile.name ? profile.name + " さん" : "管理者としてログイン中";
        mountAppShell({
          active: "attendance",
          profile,
          homeHref: "./home.html",
          logoutUrl: "./index.html",
          links: [
            { id: "home", label: "ホーム", href: "./home.html" },
            { id: "attendance", label: "出勤", href: "./employee_home.html" },
            { id: "learning", label: "学習", href: "./learning/index.html" },
            { id: "wood", label: "木材", href: "./wood/index.html" }
          ]
        });
      },
      onError: (error) => {
        console.error("管理者情報の確認に失敗しました:", error);
        document.getElementById("adminName").textContent =
          "管理者情報を確認できませんでした。ログインし直してください。";
      }
    });
  </script>
</body>
</html>
