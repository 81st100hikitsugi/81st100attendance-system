
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./shared/app-shell.css?v=20261120-11">
<title>出勤・退勤</title>

<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    text-align: center;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
  }
  #logoutBtn { background:#e24a4a; }
</style>
<meta name="robots" content="noindex, nofollow">
</head>

<body class="app-shell-pending">
<div class="container">
  <h2>出勤・退勤</h2>
  <p id="statusMessage">ログイン確認中...</p>

  <a class="button" id="clockInBtn">出勤する</a>
  <a class="button" style="background:#e24a4a;" id="clockOutBtn">退勤する</a>
</div>

<script type="module">
  import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  import { auth, db } from "./shared/firebase.js";
  import { getUserProfile } from "./shared/auth.js";
  import { mountAppShell } from "./shared/app-shell.js?v=20261120-10";

  let currentUserId = null;
  let attendanceSaving = false;

  // ログイン確認とホーム画面の振り分け
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    currentUserId = user.uid;

    const profile = await getUserProfile(user);
    if (!profile) {
      window.location.replace("./index.html");
      return;
    }
    mountAppShell({ active: "attendance", profile, homeHref: "./home.html", logoutUrl: "./index.html", links: [
      { id: "home", label: "ホーム", href: "./home.html" },
      { id: "attendance", label: "出勤", href: "./employee_home.html" },
      { id: "learning", label: "学習", href: "./learning/index.html" },
      { id: "wood", label: "木材", href: "./wood/index.html" }
    ] });

    document.getElementById("statusMessage").textContent =
      `${user.email} さんとしてログイン中`;

    try {
      const userDoc = await getDoc(
        doc(db, "students", user.uid)
      );

      if (!userDoc.exists()) {
        document.getElementById("statusMessage").textContent =
          "ユーザー情報が見つかりません。";
        return;
      }

      const data = userDoc.data();

      // 共通ホームへ戻る導線は共通ナビゲーションで提供します。

    } catch (error) {
      console.error("ユーザー情報取得エラー:", error);

      document.getElementById("statusMessage").textContent =
        "ユーザー情報を取得できませんでした。";
    }
  });

  // 出勤・退勤保存
  async function saveAttendance(state) {
    if (!currentUserId) return;

    if (attendanceSaving) return;
    attendanceSaving = true;
    const clockInBtn = document.getElementById("clockInBtn");
    const clockOutBtn = document.getElementById("clockOutBtn");
    clockInBtn.style.pointerEvents = "none";
    clockOutBtn.style.pointerEvents = "none";
    const now = new Date();
    const uniquePart = globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2);
    const docId = `${currentUserId}_${now.getTime()}_${uniquePart}`;

    try {
      await setDoc(doc(db, "attendanceItems", docId), {
        userId: currentUserId,
        date: serverTimestamp(),
        shift: "未設定",
        state: state,
        time: now.toLocaleString("ja-JP"),
        notes: "",
        check: true,
        history: []
      });

      document.getElementById("statusMessage").textContent =
        `${state}を記録しました（${now.toLocaleString("ja-JP")}）`;

    } catch (error) {
      console.error("打刻保存エラー:", error);
      document.getElementById("statusMessage").textContent =
        "記録に失敗しました。通信状況を確認してください。";
    } finally {
      attendanceSaving = false;
      clockInBtn.style.pointerEvents = "";
      clockOutBtn.style.pointerEvents = "";
    }
  }

  document.getElementById("clockInBtn").onclick = () =>
    saveAttendance("出勤");

  document.getElementById("clockOutBtn").onclick = () =>
    saveAttendance("退勤");
</script>

</body>
</html>
