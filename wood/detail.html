<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2878c8"><title>木材詳細</title><link rel="stylesheet" href="../shared/app-shell.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#202833;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1200px,calc(100% - 28px));margin:24px auto 90px}.panel{background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:18px;margin:16px 0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0 0 8px;font-size:1.65rem}.muted{color:#667085}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.summary div{padding:12px;background:#f7f9fc;border-radius:9px}.summary strong{display:block;font-size:.82rem;color:#667085}.summary span{display:block;margin-top:4px;font-weight:700}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{background:#f7f9fc;color:#526174;font-size:.84rem;white-space:nowrap}input,select{max-width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}input[type=checkbox]{width:18px;height:18px}button{border:0;border-radius:8px;padding:9px 13px;background:#2878c8;color:white;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#e9eef5;color:#334155}button.danger{background:#b93838}button:disabled{opacity:.55;cursor:not-allowed}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#f7f9fc;border-radius:9px}.bulk label{font-size:.88rem}.item-note{width:160px}.assignee{width:130px}.state{font-weight:700}.status{min-height:24px}.history{display:grid;gap:8px}.history-entry{padding:10px;border:1px solid #edf0f4;border-radius:8px}.history-entry strong{display:block}.empty{padding:18px;text-align:center;color:#667085}.reservation{white-space:nowrap}.hint{font-size:.82rem;color:#667085}
@media(max-width:700px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:13px}}
</style><meta name="robots" content="noindex, nofollow">
</head><body><main>
<div class="topline"><div><h1 id="groupTitle">木材詳細</h1><p id="groupSubtitle" class="muted"></p></div><div id="adminActions" hidden><button id="addItem">＋ 個別木材を追加</button></div></div>
<section class="panel"><div class="summary"><div><strong>素材</strong><span id="material">—</span></div><div><strong>長さ</strong><span id="length">—</span></div><div><strong>数量</strong><span id="quantity">—</span></div><div><strong>代表状態</strong><span id="representative">—</span></div></div><p id="groupNotes" class="muted"></p></section>
<section class="panel"><div class="topline"><h2>個別木材</h2><span id="itemCount" class="muted"></span></div>
<div class="bulk"><label><input type="checkbox" id="selectAll"> 表示中をすべて選択</label><label for="bulkProcess">工程</label><select id="bulkProcess"><option value="">変更しない</option><option>未着手</option><option>罫書き</option><option>切断</option><option>やすり</option><option>組立</option><option>完了</option></select><label for="bulkProgress">進行</label><select id="bulkProgress"><option value="">変更しない</option><option>予約</option><option>中</option><option>終了</option></select><label for="bulkAssignee">担当者</label><input id="bulkAssignee" placeholder="変更しない"><label for="bulkNotes">備考</label><input id="bulkNotes" placeholder="変更しない"><button id="bulkSave">選択した行を更新</button></div>
<p class="hint">チェックを付けた個別行だけを一括更新します。工程と進行は標準順以外の変更も可能で、変更履歴に記録されます。</p>
<div class="table-wrap"><table><thead><tr><th>一括選択</th><th>確認</th><th>工程</th><th>進行</th><th>担当者</th><th>備考</th><th>更新日時</th><th>予約</th><th>操作</th></tr></thead><tbody id="itemRows"><tr><td colspan="9" class="empty">読み込み中...</td></tr></tbody></table></div>
</section>
<section class="panel"><h2>変更履歴</h2><div id="historyList" class="history"><p class="empty">読み込み中...</p></div></section>
<p id="status" class="status" role="status"></p>
</main>
<script type="module">
import {collection,getDocs,getDocsFromCache,getDoc,getDocFromCache,doc,addDoc,updateDoc,deleteDoc,writeBatch,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {db,persistenceReady} from "../shared/firebase.js";import {requireUser} from "../shared/auth.js";import {mountAppShell} from "../shared/app-shell.js";
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),groupId=params.get("id"),processes=["未着手","罫書き","切断","やすり","組立","完了"],progresses=["予約","中","終了"];
let user=null,profile=null,isAdmin=false,group=null,items=[],logs=[],online=navigator.onLine;
const status=(s,error=false)=>{$("status").textContent=s;$("status").style.color=error?"#b93838":"#526174"};
const dateValue=v=>{if(!v)return "—";const d=typeof v.toDate==="function"?v.toDate():new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleString("ja-JP")};
const progressFor=p=>p==="未着手"||p==="完了"?null:"予約";
const stateName=i=>[i.process,i.progress].filter(Boolean).join(" / ")||"未着手";
const assigneeName=i=>i.assigneeName||i.assignee||i.assignedToName||i.assignedTo||"";
function representative(list){if(!list.length)return "未着手";const rank=i=>{const p=processes.indexOf(i.process||"未着手");const q=progresses.indexOf(i.progress||"予約");return p<0?999:p*4+(q<0?0:q)};return stateName(list.slice().sort((a,b)=>rank(a)-rank(b))[0])}
async function syncGroupSummary(list,updateQuantity=false){const data={representativeState:representative(list),check:list.length>0&&list.every(i=>i.check===true),updatedAt:serverTimestamp()};if(updateQuantity)data.quantity=list.length;await updateDoc(doc(db,"woodGroups",groupId),data)}
function populateSelect(select,selected){select.replaceChildren();for(const p of processes){const o=document.createElement("option");o.value=p;o.textContent=p;o.selected=p===selected;select.append(o)}}
function progressSelect(select,process,selected){select.replaceChildren();if(process==="未着手"||process==="完了"){const o=document.createElement("option");o.value="";o.textContent="—";select.append(o);select.disabled=true;return}select.disabled=false;for(const p of progresses){const o=document.createElement("option");o.value=p;o.textContent=p;o.selected=p===(selected||"予約");select.append(o)}}
function makeRow(item){
 const tr=document.createElement("tr"),selectCell=document.createElement("td"),selectBox=document.createElement("input");selectBox.type="checkbox";selectBox.className="item-select";selectBox.dataset.id=item.id;selectCell.append(selectBox);tr.append(selectCell);
 const checkCell=document.createElement("td"),checkState=document.createElement("input");checkState.type="checkbox";checkState.className="item-check-state";checkState.checked=item.check===true;checkState.disabled=!online;checkState.setAttribute("aria-label","確認済み");checkState.addEventListener("change",()=>setItemCheck(item,checkState.checked));checkCell.append(checkState);tr.append(checkCell);
 const ptd=document.createElement("td"),ps=document.createElement("select");populateSelect(ps,item.process||"未着手");ps.className="process";ps.disabled=!online;ptd.append(ps);tr.append(ptd);
 const prtd=document.createElement("td"),prs=document.createElement("select");progressSelect(prs,item.process||"未着手",item.progress);prs.className="progress";prs.disabled=!online;prtd.append(prs);tr.append(prtd);
 ps.addEventListener("change",()=>progressSelect(prs,ps.value,progressFor(ps.value)));
 const atd=document.createElement("td"),assignee=document.createElement("input");assignee.className="assignee";assignee.disabled=!online;assignee.value=assigneeName(item);assignee.placeholder="担当者";atd.append(assignee);tr.append(atd);
 const ntd=document.createElement("td"),notes=document.createElement("input");notes.className="item-note";notes.disabled=!online;notes.value=item.notes||"";notes.placeholder="備考";ntd.append(notes);tr.append(ntd);
 const utd=document.createElement("td");utd.textContent=dateValue(item.updatedAt);tr.append(utd);
 const rtd=document.createElement("td"),reserve=document.createElement("button");reserve.className="reservation "+(item.reservedBy===user.uid?"secondary":"");reserve.textContent=item.reservedBy===user.uid?"予約解除":item.reservedBy?"予約中":"予約する";reserve.disabled=!online||(!!item.reservedBy&&item.reservedBy!==user.uid);reserve.addEventListener("click",()=>toggleReserve(item));rtd.append(reserve);tr.append(rtd);
 const op=document.createElement("td"),save=document.createElement("button");save.textContent="保存";save.disabled=!online;save.addEventListener("click",()=>saveItems([{item,process:ps.value,progress:prs.value||null,assignee:assignee.value.trim(),notes:notes.value.trim()}]));op.append(save);
 if(isAdmin){const del=document.createElement("button");del.className="danger";del.style.marginLeft="6px";del.textContent="削除";del.addEventListener("click",()=>removeItem(item));op.append(del)}tr.append(op);
 return tr;
}
async function readDocs(ref){try{return await getDocs(ref)}catch(error){if(!navigator.onLine)return await getDocsFromCache(ref);throw error}}
async function readDoc(ref){try{return await getDoc(ref)}catch(error){if(!navigator.onLine)return await getDocFromCache(ref);throw error}}
async function load(){
 await persistenceReady;
 const [g,i,h]=await Promise.all([readDoc(doc(db,"woodGroups",groupId)),readDocs(query(collection(db,"woodItems"),where("groupId","==",groupId))),readDocs(query(collection(db,"historyLogs"),where("groupId","==",groupId)))]);
 group=g.exists()?{id:groupId,...g.data()}:null;
 if(!group){status("木材グループが見つかりません。",true);return}
 items=i.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
 logs=h.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>timeMs(b.updatedAt)-timeMs(a.updatedAt));
 render();
}
function timeMs(v){if(!v)return 0;const d=typeof v.toDate==="function"?v.toDate():new Date(v);return d.getTime()||0}
function render(){
 $("groupTitle").textContent=group.name||"木材詳細";$("groupSubtitle").textContent="グループID："+group.id;$("material").textContent=group.material||"—";$("length").textContent=group.length??"—";$("quantity").textContent=items.length;$("representative").textContent=group.representativeState||representative(items);$("groupNotes").textContent=group.notes||"";$("itemCount").textContent=items.length+" 本";
 $("adminActions").hidden=!isAdmin;const body=$("itemRows");body.replaceChildren();if(!items.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=9;td.className="empty";td.textContent="個別木材がありません。";tr.append(td);body.append(tr)}else items.forEach(i=>body.append(makeRow(i)));
 $("selectAll").checked=false;renderLogs();
}
function renderLogs(){const box=$("historyList");box.replaceChildren();if(!logs.length){const p=document.createElement("p");p.className="empty";p.textContent="履歴はまだありません。";box.append(p);return}for(const log of logs){const e=document.createElement("div");e.className="history-entry";const title=document.createElement("strong");title.textContent=(log.itemName||"個別木材")+"： "+(log.oldState||"—")+" → "+(log.newState||"—");const detail=document.createElement("div");detail.className="muted";detail.textContent=[log.updatedByName||log.updatedBy||"",dateValue(log.updatedAt),log.notes||""].filter(Boolean).join(" / ");e.append(title,detail);box.append(e)}}
async function saveItems(changes){
  if(!online){status("オフライン中は更新できません。",true);return}
  if(!changes.length)return;status("保存しています...");
 try{
  const now=serverTimestamp();
  for(let offset=0;offset<changes.length;offset+=200){
   const batch=writeBatch(db);
   for(const c of changes.slice(offset,offset+200)){
    const old=c.item,nextProgress=c.process==="未着手"||c.process==="完了"?null:c.progress||"予約",newState=[c.process,nextProgress].filter(Boolean).join(" / ")||"未着手",oldState=stateName(old),changed=oldState!==newState||assigneeName(old)!==c.assignee||String(old.notes||"")!==c.notes;
    if(!changed)continue;
    const itemRef=doc(db,"woodItems",old.id),historyEntry={oldState,newState,updatedBy:user.uid,updatedByName:profile.name||user.email||"",updatedAt:new Date().toISOString(),notes:c.notes};
    batch.update(itemRef,{process:c.process,progress:nextProgress,assignee:c.assignee,assigneeName:c.assignee,notes:c.notes,updatedBy:user.uid,updatedAt:now,history:[...(old.history||[]),historyEntry]});
    const logRef=doc(collection(db,"historyLogs"));batch.set(logRef,{itemId:old.id,groupId,oldProcess:old.process||"未着手",newProcess:c.process,oldProgress:old.progress||null,newProgress:nextProgress,oldState,newState,updatedBy:user.uid,updatedByName:profile.name||user.email||"",updatedAt:now,notes:c.notes});
   }
   await batch.commit();
  }
  const refreshed=await getDocs(query(collection(db,"woodItems"),where("groupId","==",groupId))),next=refreshed.docs.map(d=>({id:d.id,...d.data()}));
  await syncGroupSummary(next);
  await load();status(changes.length+" 件の更新を保存しました。");
 }catch(e){console.error(e);status("保存に失敗しました。通信状態やアクセス権を確認してください。",true)}
}
async function setItemCheck(item,checked){if(!online)return status("オフライン中は更新できません。",true);try{await updateDoc(doc(db,"woodItems",item.id),{check:checked,updatedBy:user.uid,updatedAt:serverTimestamp()});const next=items.map(x=>x.id===item.id?{...x,check:checked}:x);await syncGroupSummary(next);await load();status("確認状態を更新しました。")}catch(e){console.error(e);status("確認状態を更新できませんでした。",true);await load()}}
async function toggleReserve(item){if(!online)return status("オフライン中は更新できません。",true);try{const ref=doc(db,"woodItems",item.id);if(item.reservedBy===user.uid)await updateDoc(ref,{reservedBy:null,reservedAt:null,reservedName:null,updatedBy:user.uid,updatedAt:serverTimestamp()});else if(!item.reservedBy)await updateDoc(ref,{reservedBy:user.uid,reservedAt:serverTimestamp(),reservedName:profile.name||user.email||"",updatedBy:user.uid,updatedAt:serverTimestamp()});await load();status("予約状態を更新しました。")}catch(e){console.error(e);status("予約状態を更新できませんでした。",true)}}
async function removeItem(item){if(!isAdmin||!online||!confirm("この個別木材を削除しますか？"))return;try{await deleteDoc(doc(db,"woodItems",item.id));const refreshed=await getDocs(query(collection(db,"woodItems"),where("groupId","==",groupId)));await syncGroupSummary(refreshed.docs.map(d=>({id:d.id,...d.data()})),true);await load();status("個別木材を削除しました。")}catch(e){status("削除できませんでした。",true)}}
$("addItem").addEventListener("click",async()=>{if(!isAdmin||!online){status("オフライン中は更新できません。",true);return}try{const ref=await addDoc(collection(db,"woodItems"),{groupId,process:"未着手",progress:null,assignee:"",assigneeName:"",updatedBy:user.uid,updatedAt:serverTimestamp(),notes:"",check:false,history:[]});const refreshed=await getDocs(query(collection(db,"woodItems"),where("groupId","==",groupId)));await syncGroupSummary(refreshed.docs.map(d=>({id:d.id,...d.data()})),true);await load();status("個別木材を追加しました。")}catch(e){console.error(e);status("追加できませんでした。",true)}});
$("selectAll").addEventListener("change",()=>document.querySelectorAll(".item-select").forEach(c=>c.checked=$("selectAll").checked));
$("bulkSave").addEventListener("click",()=>{const chosen=[...document.querySelectorAll("#itemRows tr")].filter(tr=>tr.querySelector(".item-select")?.checked).map(tr=>{const item=items.find(i=>i.id===tr.querySelector(".item-select").dataset.id);return{item,process:$("bulkProcess").value||item.process,progress:$("bulkProgress").value?($("bulkProgress").value==="なし"?null:$("bulkProgress").value):item.progress,assignee:$("bulkAssignee").value.trim()||assigneeName(item),notes:$("bulkNotes").value.trim()||item.notes||""}}).filter(x=>x.item);if(!chosen.length){status("更新する個別木材にチェックを付けてください。",true);return}saveItems(chosen)});
function updateConnectionState(){online=navigator.onLine;$("bulkSave").disabled=!online;$("addItem").disabled=!online;document.querySelectorAll(".process,.progress,.assignee,.item-note,.item-check,.item-check-state,#bulkProcess,#bulkProgress,#bulkAssignee,#bulkNotes").forEach(el=>el.disabled=!online);document.querySelectorAll("#itemRows button").forEach(el=>{if(el.classList.contains("reservation")){const item=items.find(x=>x.id===el.closest("tr")?.querySelector(".item-select")?.dataset.id);el.disabled=!online||!!(item?.reservedBy&&item.reservedBy!==user.uid)}else el.disabled=!online});if(!online)status("オフライン中のため閲覧のみ利用できます。");else if($("status").textContent==="オフライン中のため閲覧のみ利用できます。")status("オンラインに復帰しました。")}
window.addEventListener("online",updateConnectionState);window.addEventListener("offline",updateConnectionState);
function boot(ctx){user=ctx.user;profile=ctx.profile;isAdmin=profile.isAdmin===true;mountAppShell({active:"wood",profile,homeHref:"../home.html",logoutUrl:"../index.html",links:[{id:"home",label:"ホーム",href:"../home.html"},{id:"attendance",label:"出勤",href:"../employee_home.html"},{id:"learning",label:"学習",href:"../learning/index.html"},{id:"wood",label:"木材",href:"./index.html"}]});if(!groupId){status("木材グループIDが指定されていません。",true);return}updateConnectionState();load().catch(e=>{console.error(e);status("木材詳細を読み込めませんでした。",true)})}
requireUser({loginUrl:"../index.html",onReady:boot,onError:e=>status(e.message,true)});
</script></body></html>
