<div id="groupModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <form id="groupForm" class="dialog"><h2 id="modalTitle">まとめ行を登録</h2><input type="hidden" id="groupId">
  <div class="dialog-grid">
   <div class="field"><label for="groupName">名称</label><input id="groupName" required maxlength="120"></div>
   <div class="field"><label for="groupMaterial">素材</label><input id="groupMaterial" maxlength="80"></div>
   <div class="field"><label for="groupLength">長さ</label><input id="groupLength" type="number" min="0" step="any"></div>
   <div class="field"><label for="groupQuantity">数量</label><input id="groupQuantity" type="number" min="1" max="400" step="1" required value="1"></div>
   <div class="field" style="grid-column:1/-1"><label for="groupNotes">備考</label><input id="groupNotes" maxlength="1000"></div>
  </div><p id="quantityHint" class="hint">新規登録時は数量分の個別木材を作成します。既存グループの数量変更は個別木材の増減も反映します。</p>
  <div class="dialog-actions"><button type="button" id="cancelGroup" class="secondary">キャンセル</button><button type="submit" id="saveGroup">保存</button></div>
 </form>
</div>
<script type="module">
import {collection,getDocs,getDocsFromCache,doc,addDoc,updateDoc,deleteDoc,writeBatch,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {db,persistenceReady} from "../shared/firebase.js";
import {requireUser} from "../shared/auth.js";
import {mountAppShell} from "../shared/app-shell.js?v=20261122-3";
const $=id=>document.getElementById(id), processes=["未着手","罫書き","切断","やすり","組立","完了"];
let currentUser=null,profile=null,isAdmin=false,groups=[],items=[],activeFilters={},online=navigator.onLine;
const status=(s,error=false)=>{$("status").textContent=s;$("status").style.color=error?"#b93838":"#526174"};
const text=(v)=>String(v??"");
function closeHeaderMenus(){document.querySelectorAll(".column-filter-menu").forEach(menu=>{menu.hidden=true;menu.style.position="";menu.style.top="";menu.style.left="";menu.style.maxWidth="";});document.querySelectorAll(".row-menu-panel").forEach(menu=>{menu.hidden=true;menu.style.position="";menu.style.top="";menu.style.left="";menu.style.right="";menu.style.width="";menu.style.maxWidth="";menu.style.zIndex="";if(menu._rowMenuHome&&menu.parentNode===document.body)menu._rowMenuHome.append(menu)});document.querySelectorAll(".row-menu-trigger").forEach(button=>button.setAttribute("aria-expanded","false"));}
function toggleHeaderLengthMode(){const tolerance=$("headerLengthMode").value==="tolerance";$("headerLengthMin").closest(".length-range").hidden=tolerance;$("headerLengthTarget").closest(".length-target").hidden=!tolerance;}
function syncHeaderControls(){
 const f=activeFilters||{};
 $("headerNameFilter").value=f.name||"";$("headerMaterialFilter").value=f.material||"";
 $("headerLengthMode").value=f.lengthMode||"range";$("headerLengthMin").value=f.min||"";$("headerLengthMax").value=f.max||"";$("headerLengthTarget").value=f.target||"";$("headerLengthTolerance").value=f.tolerance??"0";
 $("headerQuantitySort").value=f.sort||"";$("headerCheckFilter").value=f.check||"";$("headerNotesFilter").value=f.notes||"";
 for(const [id,key] of [["headerProcessFilter","process"],["headerProgressFilter","progress"],["headerAssigneeFilter","assignees"]])$(id).querySelectorAll('input[type="checkbox"]').forEach(o=>o.checked=(f[key]||[]).includes(o.value));
 toggleHeaderLengthMode();
}
function applyHeaderFilters(){
 activeFilters={name:$("headerNameFilter").value.trim(),material:$("headerMaterialFilter").value.trim(),lengthMode:$("headerLengthMode").value,min:$("headerLengthMin").value,max:$("headerLengthMax").value,target:$("headerLengthTarget").value,tolerance:$("headerLengthTolerance").value,sort:$("headerQuantitySort").value,process:selectedValues("headerProcessFilter"),progress:selectedValues("headerProgressFilter"),assignees:selectedValues("headerAssigneeFilter"),notes:$("headerNotesFilter").value,check:$("headerCheckFilter").value};
 sessionStorage.setItem("woodListFilters",JSON.stringify(activeFilters));closeHeaderMenus();render();
}
function clearHeaderFilter(){
 const menu=document.querySelector(".column-filter-menu:not([hidden])");if(!menu)return;
 const reset={
 name:()=> $("headerNameFilter").value="",
 material:()=> $("headerMaterialFilter").value="",
 length:()=>{$("headerLengthMode").value="range";$("headerLengthMin").value="";$("headerLengthMax").value="";$("headerLengthTarget").value="";$("headerLengthTolerance").value="0";toggleHeaderLengthMode();},
 quantity:()=> $("headerQuantitySort").value="",
 state:()=>["headerProcessFilter","headerProgressFilter"].forEach(id=>$(id).querySelectorAll('input[type="checkbox"]').forEach(o=>o.checked=false)),assignees:()=> $("headerAssigneeFilter").querySelectorAll('input[type="checkbox"]').forEach(o=>o.checked=false),
 check:()=> $("headerCheckFilter").value="",
 notes:()=> $("headerNotesFilter").value=""
 };
 reset[menu.dataset.menu]?.();applyHeaderFilters();
}
const assigneeOf=x=>x.assigneeName||x.assignee||x.assignedToName||x.assignedTo||"";
const stateOf=x=>x.process==="未着手"||x.process==="完了"?x.process:[x.process,x.progress].filter(Boolean).join(" / ");
const processOrder=["未着手","罫書き","切断","やすり","組立","完了"],progressOrder=["予約","中","終了"];
function representativeItem(list){if(!list.length)return null;const rank=x=>{const p=processOrder.indexOf(x.process||"未着手"),q=progressOrder.indexOf(x.progress||"予約");return p<0?999:p*4+(q<0?0:q)};return list.slice().sort((a,b)=>rank(a)-rank(b))[0]}
 function representativeState(list){const item=representativeItem(list);return item?stateOf(item):"未着手"}
function options(select,values){select.replaceChildren();for(const value of values){const o=document.createElement("option");o.value=value;o.textContent=value;select.append(o)}}
function refreshAssigneeOptions(){const values=[...new Set(items.map(assigneeOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));options($("assigneeFilter"),values);const box=$("headerAssigneeFilter");box.replaceChildren();for(const value of values){const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.value=value;label.append(input,document.createTextNode(value));box.append(label)}}
async function readDocs(ref){try{return await getDocs(ref)}catch(error){if(!navigator.onLine)return await getDocsFromCache(ref);throw error}}
async function load(){
 status("データを読み込んでいます...");
 await persistenceReady;
 const [g,i]=await Promise.all([readDocs(collection(db,"woodGroups")),readDocs(collection(db,"woodItems"))]);
 groups=g.docs.map(d=>({id:d.id,...d.data()}));items=i.docs.map(d=>({id:d.id,...d.data()}));
 refreshAssigneeOptions();restoreFilters();if(!Object.keys(activeFilters).length)clear();else render();if(!online)status("オフライン中のため閲覧のみ利用できます。");else status("読み込み完了");
}
function selectedValues(id){const el=$(id);return el.matches("select")?[...el.selectedOptions].map(o=>o.value):[...el.querySelectorAll('input[type="checkbox"]:checked')].map(o=>o.value)}
function render(){
 const f=activeFilters, body=$("groupRows");body.replaceChildren();
 const visibleGroups=groups,visibleItems=items;
 let list=visibleGroups.filter(g=>{
  const its=visibleItems.filter(i=>i.groupId===g.id), name=text(g.name).toLocaleLowerCase(),material=text(g.material).toLocaleLowerCase();
  if(f.name&&!f.name.toLocaleLowerCase().split(/[\s　]+/).filter(Boolean).some(word=>name.includes(word)))return false;
  if(f.material&&!f.material.toLocaleLowerCase().split(/[\s　,、，]+/).filter(Boolean).some(word=>material.includes(word)))return false;
  const hasLength=g.length!==null&&g.length!==undefined&&g.length!=="";const length=Number(g.length);if(f.lengthMode==="tolerance"&&f.target!==""){if(!hasLength||!Number.isFinite(length)||Math.abs(length-Number(f.target))>Number(f.tolerance||0))return false}else if(f.lengthMode==="range"&&((f.min!==""&&(!hasLength||!Number.isFinite(length)||length<Number(f.min)))||(f.max!==""&&(!hasLength||!Number.isFinite(length)||length>Number(f.max)))))return false;
  if(f.process.length&&!its.some(i=>f.process.includes(i.process)))return false;
  if(f.progress.length&&!its.some(i=>f.progress.includes(i.progress||"なし")))return false;
  if(f.assignees.length&&!its.some(i=>f.assignees.includes(assigneeOf(i))))return false;
  const notes=its.some(i=>text(i.notes).trim())||text(g.notes).trim();if(f.notes==="has"&&!notes)return false;if(f.notes==="none"&&notes)return false;
  const allChecked=its.length>0&&its.every(i=>i.check===true);if(f.check==="yes"&&!allChecked)return false;if(f.check==="no"&&allChecked)return false;
  return true;
 });
 if(f.sort)list.sort((a,b)=>((visibleItems.filter(i=>i.groupId===a.id).length)-(visibleItems.filter(i=>i.groupId===b.id).length))*(f.sort==="asc"?1:-1));
 $("resultCount").textContent=list.length+" 件";
 if(!list.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=10;td.className="empty";td.textContent="条件に一致する木材はありません。";tr.append(td);body.append(tr);return}
 for(const g of list){
  const its=visibleItems.filter(i=>i.groupId===g.id);
  const tr=document.createElement("tr");
  const name=document.createElement("td"),nameWrap=document.createElement("div"),link=document.createElement("a");nameWrap.className="name-cell";link.className="group-link";link.textContent=g.name||"名称未設定";link.href="./detail.html?id="+encodeURIComponent(g.id);nameWrap.append(link);
  const representative=representativeItem(its);
  const vals=[g.material||"—",g.length??"—",its.length,representative?.process||"未着手",representative?.progress||"—",representative?assigneeOf(representative)||"—":"—",its.length>0&&its.every(i=>i.check===true)?"✓":"—",g.notes||""];
  tr.append(name);for(const value of vals){const td=document.createElement("td");td.textContent=text(value);tr.append(td)}
  const actionCell=document.createElement("td");
  if(isAdmin){
   const wrap=document.createElement("div"),trigger=document.createElement("button"),menu=document.createElement("div");
   wrap.className="row-menu";trigger.type="button";trigger.className="row-menu-trigger";trigger.textContent="⋮";trigger.setAttribute("aria-label","管理メニュー");trigger.setAttribute("aria-expanded","false");
   menu.className="row-menu-panel";menu.hidden=true;
   const edit=document.createElement("button");edit.type="button";edit.textContent="編集";edit.disabled=!online;edit.addEventListener("click",()=>{closeHeaderMenus();editGroup(g)});
   const remove=document.createElement("button");remove.type="button";remove.className="danger";remove.textContent="削除";remove.disabled=!online;remove.addEventListener("click",()=>{closeHeaderMenus();removeGroup(g)});
   menu.append(edit,remove);menu._rowMenuHome=wrap;trigger.addEventListener("click",event=>{event.stopPropagation();const wasOpen=!menu.hidden;closeHeaderMenus();if(wasOpen)return;menu.hidden=false;document.body.append(menu);menu.style.position="fixed";menu.style.right="auto";menu.style.width="max-content";menu.style.maxWidth="calc(100vw - 16px)";menu.style.zIndex="2000";const rect=trigger.getBoundingClientRect(),menuRect=menu.getBoundingClientRect(),width=menuRect.width||140,height=menuRect.height||80;menu.style.left=Math.max(8,Math.min(rect.right-width,window.innerWidth-width-8))+"px";menu.style.top=rect.bottom+height+8<=window.innerHeight?rect.bottom+4+"px":Math.max(8,rect.top-height-4)+"px";trigger.setAttribute("aria-expanded","true")});wrap.append(trigger,menu);actionCell.append(wrap);
  }
  name.append(nameWrap);tr.append(actionCell);
  body.append(tr);
 }
}
function apply(){applyHeaderFilters()}
function clear(){for(const id of ["nameFilter","materialFilter","lengthMin","lengthMax","lengthTarget","quantitySort","notesFilter"])$(id).value="";$("lengthMode").value="range";$("lengthTolerance").value="0";for(const id of ["processFilter","progressFilter","assigneeFilter"])for(const o of $(id).options)o.selected=false;activeFilters={name:"",material:"",lengthMode:"range",min:"",max:"",target:"",tolerance:"0",sort:"",process:[],progress:[],assignees:[],notes:""};sessionStorage.removeItem("woodListFilters");toggleLengthMode();activeFilters.check="";syncHeaderControls();render()}
function toggleLengthMode(){const tolerance=$("lengthMode").value==="tolerance";$("rangeMinField").hidden=tolerance;$("rangeMaxField").hidden=tolerance;$("targetLengthField").hidden=!tolerance;$("toleranceField").hidden=!tolerance}
function restoreFilters(){try{const f=JSON.parse(sessionStorage.getItem("woodListFilters")||"null");if(!f)return;for(const [id,key] of [["nameFilter","name"],["materialFilter","material"],["lengthMode","lengthMode"],["lengthMin","min"],["lengthMax","max"],["lengthTarget","target"],["lengthTolerance","tolerance"],["quantitySort","sort"],["notesFilter","notes"]])if(f[key]!==undefined)$(id).value=f[key];for(const [id,key] of [["processFilter","process"],["progressFilter","progress"],["assigneeFilter","assignees"]])for(const o of $(id).options)o.selected=(f[key]||[]).includes(o.value);activeFilters=f;toggleLengthMode();syncHeaderControls()}catch(e){sessionStorage.removeItem("woodListFilters")}}
function openModal(g=null){$("groupForm").reset();$("groupId").value=g?.id||"";$("modalTitle").textContent=g?"まとめ行を編集":"まとめ行を登録";$("groupName").value=g?.name||"";$("groupMaterial").value=g?.material||"";$("groupLength").value=g?.length??"";$("groupQuantity").value=g?.quantity??1;$("groupNotes").value=g?.notes||"";$("quantityHint").textContent=g?"数量を変更すると個別木材の数も調整します。":"新規登録時は数量分の個別木材を作成します。";$("groupModal").classList.add("open")}
function editGroup(g){if(!isAdmin||!online)return;openModal(g)}
async function removeGroup(g){if(!isAdmin||!online||!confirm("「"+(g.name||"名称未設定")+"」と、その個別木材・履歴を削除しますか？"))return;try{const [itemSnap,logSnap]=await Promise.all([getDocs(query(collection(db,"woodItems"),where("groupId","==",g.id))),getDocs(query(collection(db,"historyLogs"),where("groupId","==",g.id)))]);const refs=[...itemSnap.docs.map(d=>d.ref),...logSnap.docs.map(d=>d.ref),doc(db,"woodGroups",g.id)];for(let n=0;n<refs.length;n+=450){const batch=writeBatch(db);refs.slice(n,n+450).forEach(ref=>batch.delete(ref));await batch.commit()}await load();status("まとめ行と関連データを削除しました。")}catch(e){console.error(e);status("削除できませんでした。",true)}}
function closeModal(){$("groupModal").classList.remove("open")}
$("applyFilters").addEventListener("click",apply);$("clearFilters").addEventListener("click",clear);
function toggleColumnFilter(header){
 const target=document.querySelector('[data-menu="'+header.dataset.filter+'"]');
 if(!target)return;
 const wasOpen=!target.hidden;
 closeHeaderMenus();
 if(wasOpen)return;
 syncHeaderControls();
 target.hidden=false;
 target.style.position="fixed";
 target.style.maxWidth="calc(100vw - 24px)";
 const rect=header.getBoundingClientRect();
 const menuRect=target.getBoundingClientRect();
 const width=menuRect.width||230;
 const left=Math.max(8,Math.min(rect.left,window.innerWidth-width-8));
 const height=menuRect.height||180;
 const top=rect.bottom+height+8<=window.innerHeight?rect.bottom+4:Math.max(8,rect.top-height-4);
 target.style.left=left+"px";
 target.style.top=top+"px";
}
document.querySelectorAll(".filter-th[data-filter]").forEach(header=>{
 header.addEventListener("click",event=>{
  if(event.target.closest(".column-filter-menu"))return;
  toggleColumnFilter(header);
 });
 header.addEventListener("keydown",event=>{
  if(event.key!=="Enter"&&event.key!==" ")return;
  if(event.target!==header)return;
  event.preventDefault();
  toggleColumnFilter(header);
 });
});
document.querySelectorAll("[data-apply-header]").forEach(button=>button.addEventListener("click",applyHeaderFilters));
document.querySelectorAll("[data-clear-header]").forEach(button=>button.addEventListener("click",clearHeaderFilter));
$("headerLengthMode").addEventListener("change",toggleHeaderLengthMode);
document.addEventListener("click",event=>{if(!event.target.closest(".filter-th")&&!event.target.closest(".row-menu")&&!event.target.closest(".row-menu-panel"))closeHeaderMenus()});window.addEventListener("scroll",closeHeaderMenus,{passive:true});window.addEventListener("resize",closeHeaderMenus);
$("lengthMode").addEventListener("change",toggleLengthMode);
document.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click",()=>{for(const o of $(b.dataset.all).options)o.selected=true}));
document.querySelectorAll("[data-none]").forEach(b=>b.addEventListener("click",()=>{for(const o of $(b.dataset.none).options)o.selected=false}));$("addGroup").addEventListener("click",()=>openModal());$("cancelGroup").addEventListener("click",closeModal);
$("groupRows").addEventListener("dblclick",e=>{const a=e.target.closest("a");if(a&&isAdmin){const g=groups.find(x=>x.id===decodeURIComponent(a.href.split("id=")[1]||""));if(g)editGroup(g)}});
$("groupForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!isAdmin||!online){status("オフライン中は閲覧のみ利用できます。",true);return}const save=$("saveGroup");save.disabled=true;
 try{
  const name=$("groupName").value.trim(),material=$("groupMaterial").value.trim(),length=$("groupLength").value===""?null:Number($("groupLength").value),quantity=Number($("groupQuantity").value),notes=$("groupNotes").value.trim(),id=$("groupId").value;
  if(!name||!Number.isInteger(quantity)||quantity<1||quantity>400|| (length!==null&&(!Number.isFinite(length)||length<0)))throw new Error("名称・長さ・数量を確認してください。");
  if(!id){
   const groupRef=doc(collection(db,"woodGroups")),batch=writeBatch(db);batch.set(groupRef,{name,material,length,quantity,representativeState:"未着手",notes,check:false,createdBy:currentUser.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   for(let n=0;n<quantity;n++){const itemRef=doc(collection(db,"woodItems"));batch.set(itemRef,{groupId:groupRef.id,process:"未着手",progress:null,assignee:"",assigneeName:"",updatedBy:currentUser.uid,updatedAt:serverTimestamp(),notes:"",check:false,history:[]})}
   await batch.commit();
  }else{
   const existing=items.filter(x=>x.groupId===id),batch=writeBatch(db);batch.update(doc(db,"woodGroups",id),{name,material,length,quantity,notes,updatedAt:serverTimestamp()});
   if(quantity>existing.length)for(let n=existing.length;n<quantity;n++){const itemRef=doc(collection(db,"woodItems"));batch.set(itemRef,{groupId:id,process:"未着手",progress:null,assignee:"",assigneeName:"",updatedBy:currentUser.uid,updatedAt:serverTimestamp(),notes:"",check:false,history:[]})}
   if(quantity<existing.length)for(const item of existing.slice(quantity)){batch.delete(doc(db,"woodItems",item.id))}
   await batch.commit();
   if(id){const refreshed=await getDocs(query(collection(db,"woodItems"),where("groupId","==",id)));const next=refreshed.docs.map(d=>({id:d.id,...d.data()}));await updateDoc(doc(db,"woodGroups",id),{quantity:next.length,representativeState:representativeState(next),check:next.length>0&&next.every(x=>x.check===true),updatedAt:serverTimestamp()})}
  }
  closeModal();await load();status("まとめ行を保存しました。");
 }catch(err){console.error(err);status(err.message||"保存に失敗しました。",true)}finally{save.disabled=false}
});
function updateConnectionState(){online=navigator.onLine;$("addGroup").disabled=!online;$("saveGroup").disabled=!online;document.querySelectorAll(".group-edit,.group-delete").forEach(b=>b.disabled=!online);if(!online)status("オフライン中のため閲覧のみ利用できます。");else if($("status").textContent==="オフライン中のため閲覧のみ利用できます。")status("オンラインに復帰しました。")}
window.addEventListener("online",updateConnectionState);window.addEventListener("offline",updateConnectionState);
function boot(ctx,admin){currentUser=ctx.user;profile=ctx.profile;isAdmin=admin;mountAppShell({active:"wood",profile,homeHref:"../home.html",logoutUrl:"../index.html",links:[{id:"home",label:"ホーム",href:"../home.html"},{id:"attendance",label:"出勤",href:"../employee_home.html"},{id:"learning",label:"学習",href:"../learning/index.html"},{id:"wood",label:"木材",href:"./index.html"}]});$("adminTools").hidden=!isAdmin;updateConnectionState();load().catch(e=>{console.error(e);status("木材データを読み込めませんでした。",true)})}
requireUser({loginUrl:"../index.html",onReady:ctx=>{if(ctx.profile.isAdmin===true){boot(ctx,true)}else{boot(ctx,false)}},onError:e=>status(e.message,true)});
</script>
