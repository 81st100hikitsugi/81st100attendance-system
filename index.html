<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2878c8">
<title>ログイン - 業務管理システム</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    text-align: center;
  }
  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
  }
  #loginBtn { background:#4caf50; }
  #errorMessage { color:red; margin-top:10px; }
</style>
</head>

<body>
<div class="container">
  <h2>ログイン</h2>

  <input type="email" id="emailInput" placeholder="メールアドレス">
  <input type="password" id="passwordInput" placeholder="パスワード">

  <a class="button" id="loginBtn">ログイン</a>

  <p id="errorMessage"></p>
</div>

<script type="module">
  import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { auth, db, persistenceReady } from "./shared/firebase.js";

  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("emailInput").value;
    const password = document.getElementById("passwordInput").value;
    const errorMessage = document.getElementById("errorMessage");

    errorMessage.textContent = "";

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      await persistenceReady;

      // UID と students を 1対1で紐づけて取得
      const userDoc = await getDoc(doc(db, "students", user.uid));

      if (!userDoc.exists()) {
        await signOut(auth);
        errorMessage.textContent = "このアカウントのユーザー情報が登録されていません。管理者に確認してください。";
        return;
      }

      // ログイン後は役職・管理者権限に関係なく統合ホームへ進む。
      // 各機能の管理者操作は students/{uid}.isAdmin で個別に判定する。
      window.location.href = "home.html";

    } catch (error) {
      errorMessage.textContent = "ログインに失敗しました。メールアドレスまたはパスワードを確認してください。";
    }
  };
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => {
          console.log("Service Worker 登録成功");
        })
        .catch((error) => {
          console.error("Service Worker 登録失敗:", error);
        });
    });
  }
</script>
</body>
</html>
