<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">
<title>ログイン - 出勤管理システム</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    text-align: center;
  }
  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
  }
  #loginBtn { background:#4caf50; }
  #errorMessage { color:red; margin-top:10px; }
</style>
</head>

<body>
<div class="container">
  <h2>ログイン</h2>

  <input type="email" id="emailInput" placeholder="メールアドレス">
  <input type="password" id="passwordInput" placeholder="パスワード">

  <a class="button" id="loginBtn">ログイン</a>

  <p id="errorMessage"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getAuth, signInWithEmailAndPassword 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { 
    getFirestore, doc, getDoc 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtBjVT9p1JlwLZhKRLzq5secW2YyD1U0U",
    authDomain: "attendance-system-eb7d1.firebaseapp.com",
    projectId: "attendance-system-eb7d1",
    storageBucket: "attendance-system-eb7d1.firebasestorage.app",
    messagingSenderId: "803269635846",
    appId: "1:803269635846:web:6e12018f4b2db2c0747887"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("emailInput").value;
    const password = document.getElementById("passwordInput").value;
    const errorMessage = document.getElementById("errorMessage");

    errorMessage.textContent = "";

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // UID と students を 1対1で紐づけて取得
      const userDoc = await getDoc(doc(db, "students", user.uid));

      if (!userDoc.exists()) {
        // 生徒として登録されていないアカウント
        window.location.href = "unknown_user.html";
        return;
      }

      const data = userDoc.data();

      // 管理者権限の判定
const isAdmin = typeof data.isAdmin === "boolean"
  ? data.isAdmin
  : data.role === "attendance";

if (isAdmin) {
  window.location.href = "admin_home.html";
} else {
  window.location.href = "employee_home.html";
}

    } catch (error) {
      errorMessage.textContent = "ログインに失敗しました。メールアドレスまたはパスワードを確認してください。";
    }
  };
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => {
          console.log("Service Worker 登録成功");
        })
        .catch((error) => {
          console.error("Service Worker 登録失敗:", error);
        });
    });
  }
</script>
</body>
</html>
