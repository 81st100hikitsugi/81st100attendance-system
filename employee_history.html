<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./shared/app-shell.css?v=20261120-10">
<title>打刻履歴 - 生徒用</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  ul { padding-left: 0; }
  li {
    list-style: none;
    background: #fafafa;
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
  }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  #logoutBtn { background:#e24a4a; }
</style>
<meta name="robots" content="noindex, nofollow">
</head>

<body class="app-shell-pending">
<div class="container">
  <h2 id="userName">打刻履歴</h2>
  <p id="statusMessage">読み込み中...</p>

  <ul id="historyList"></ul>
</div>

<script type="module">
  import { 
    collection, query, where, getDocs, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  import { auth, db } from "./shared/firebase.js";
  import { getUserProfile } from "./shared/auth.js";
  import { mountAppShell } from "./shared/app-shell.js?v=20261120-10";

  let currentUserId = null;

  // ログイン確認＋名前取得
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    currentUserId = user.uid;

    const profile = await getUserProfile(user);
    if (!profile) {
      window.location.replace("./index.html");
      return;
    }
    mountAppShell({ active: "attendance", profile, homeHref: "./home.html", logoutUrl: "./index.html", links: [
      { id: "home", label: "ホーム", href: "./home.html" },
      { id: "attendance", label: "出勤", href: "./employee_home.html" },
      { id: "learning", label: "学習", href: "./learning/index.html" },
      { id: "wood", label: "木材", href: "./wood/index.html" }
    ] });

    // Firestore から名前を取得
    const userDoc = await getDoc(doc(db, "students", user.uid));

    if (userDoc.exists()) {
      const data = userDoc.data();
      document.getElementById("userName").textContent = `ようこそ、${data.name} さん`;
      document.getElementById("statusMessage").textContent = `${data.name} さんの履歴`;
    } else {
      // 生徒として登録されていない場合はメールを表示
      document.getElementById("userName").textContent = `ようこそ、${user.email} さん`;
      document.getElementById("statusMessage").textContent = `${user.email} さんの履歴`;
    }

    loadHistory();
  });

  // 履歴読み込み
  async function loadHistory() {
    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";

    const q = query(
      collection(db, "attendanceItems"),
      where("userId", "==", currentUserId)
    );

    let snapshot;
    try {
      snapshot = await getDocs(q);
    } catch (error) {
      console.error("履歴読み込みエラー:", error);
      document.getElementById("statusMessage").textContent = "履歴を読み込めませんでした。通信状況を確認してください。";
      return;
    }

    if (snapshot.empty) {
      historyList.innerHTML = "<li>履歴がありません</li>";
      return;
    }

    const records = snapshot.docs.map(docSnap => {
      const data = docSnap.data();
      const dateValue = data.date && typeof data.date.toDate === "function"
        ? data.date.toDate()
        : (data.date ? new Date(data.date) : null);
      return { data, timestamp: dateValue && !Number.isNaN(dateValue.getTime()) ? dateValue.getTime() : 0 };
    }).sort((a, b) => b.timestamp - a.timestamp);

    records.forEach(({ data, timestamp }) => {
      const li = document.createElement("li");
      const dateText = timestamp ? new Date(timestamp).toLocaleString("ja-JP") : "";
      if (data.state === "出勤予定") {
        const scheduledDate = timestamp ? new Date(timestamp).toLocaleDateString("ja-JP") : "日付不明";
        li.textContent = `${scheduledDate}：出勤予定${data.shift ? `（${data.shift}）` : ""}`;
      } else {
        const timeText = data.time || dateText || "時刻不明";
        li.textContent = `${data.state || "状態未設定"}：${timeText}`;
      }
      historyList.appendChild(li);
    });
  }
</script>

</body>
</html>
