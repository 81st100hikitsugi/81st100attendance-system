
<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="stylesheet" href="./shared/app-shell.css">
<title>週シフト作成 - 管理者</title>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 20px 100px;
    background: #f5f7fa;
    color: #243447;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .container {
    max-width: 1400px;
    margin: 28px auto;
    padding: 20px;
    background: #fff;
    border: 1px solid #e1e6ed;

    font-size: 16px;

  .zoom-toolbar {

    align-items: center;

  .table-zoom-content { width: max-content; min-width: 100%; transform-origin: top left; }

  .densuke-table .date-cell {

  .cell:focus-visible, .date-cell:focus-visible, .slot-cell:focus-visible {
    outline: 2px solid #2878c8;
    outline-offset: -2px;

  /* 選択中は○×を含む行全体を背景色だけで強調（枠線なし） */

    background: #dceeff !important;
    box-shadow: none !important;

  .densuke-table tbody tr.is-selected-row .cell:hover { background: #dceeff !important; }

  /* 共通CSSのボタン装飾を打ち消し、従来の○×表示に戻す */
  body:has(.app-shell) .table-wrap .densuke-table button.cell {
    display: block !important;
    width: 100% !important;
    min-width: 0 !important;
    min-height: 0 !important;
    height: 38px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    color: inherit !important;
    box-shadow: none !important;
    font: inherit !important;
    font-size: 21px !important;
    font-weight: 800 !important;
    line-height: 1 !important;
    transition: none !important;
    cursor: pointer;
  }
  body:has(.app-shell) .table-wrap .densuke-table button.cell.is-scheduled {
    color: #16834a !important;
  }
  body:has(.app-shell) .table-wrap .densuke-table button.cell.is-not-scheduled {
    color: #a0a8b2 !important;
  }
  body:has(.app-shell) .table-wrap .densuke-table button.cell:hover {
    background: transparent !important;

  body:has(.app-shell) .table-wrap .densuke-table button.cell:focus-visible,
  body:has(.app-shell) .table-wrap .densuke-table .date-cell:focus-visible,
  body:has(.app-shell) .table-wrap .densuke-table .slot-cell:focus-visible {
    outline: none !important;
    outline-offset: 0 !important;
  }
  .densuke-table .date-cell.is-selected-day,
  .densuke-table .slot-cell.is-selected-slot {
    background: #dceeff !important;
  }
  .slot-legend {
    display: flex;
    flex-wrap: wrap;

    margin: 10px 2px 0;
    color: #64748b;
    font-size: 12px;
  }
  .selection-summary {
    margin-top: 18px;

    border: 1px solid #dce3eb;
    border-radius: 10px;
    background: #fff;
  }
  .selection-summary h3 { margin: 0 0 8px; font-size: 15px; }
  .summary-caption { margin: 0 0 12px; color: #64748b; font-size: 13px; }
  .summary-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .summary-stat {
    min-width: 130px;

  .summary-names { display: flex; flex-wrap: wrap; gap: 6px; }
  .summary-name {
    display: inline-block;

  }
  .empty-summary { color: #8994a2; font-size: 12px; }
  button.action {
    display: block;

  button.action:hover { background: #1f67ae; }

  @media (max-width: 650px) {
    body { padding: 10px 8px 100px; }

    h2 { font-size: 19px; }
    .table-wrap { max-height: 62vh; }
    .densuke-table th, .densuke-table td { height: 44px; }
    .zoom-toolbar { gap: 6px; padding: 8px; }
    .zoom-toolbar input[type="range"] { width: 110px; }
  }

  /* 共通デザインCSSのtable指定より、このページのシフト表を優先 */
  body:has(.app-shell) .table-wrap .table-zoom-content {
    display: block !important;
    width: max-content !important;
    min-width: 100% !important;
    visibility: visible !important;
  }
  body:has(.app-shell) .table-wrap table.densuke-table {
    display: table !important;
    width: max-content !important;
    min-width: 100% !important;
    table-layout: fixed !important;
    border-collapse: separate !important;
    border-spacing: 0 !important;
    visibility: visible !important;
    color: #243447 !important;
  }
  body:has(.app-shell) .table-wrap .densuke-table th,
  body:has(.app-shell) .table-wrap .densuke-table td {
    display: table-cell !important;
    visibility: visible !important;
    opacity: 1 !important;
    color: #243447 !important;
    border-right: 1px solid #dce3eb !important;
    border-bottom: 1px solid #dce3eb !important;
    padding: 5px 7px !important;
    text-align: center !important;
    vertical-align: middle !important;
    white-space: nowrap !important;
  }
  body:has(.app-shell) .table-wrap .densuke-table thead { display: table-header-group !important; }
  body:has(.app-shell) .table-wrap .densuke-table tbody { display: table-row-group !important; }

<body>

<div class="container">

  <h2>管理者：週シフト作成</h2>

  <div class="week-area">
    <label for="weekSelector">対象週：</label>
    <input type="date" id="weekSelector" aria-label="表示する週の日付を選択">

    <p id="selectedWeekLabel"></p>
  </div>

  <p id="statusMessage">読み込み中...</p>

  <div class="zoom-toolbar" aria-label="表の表示倍率">
    <button type="button" id="zoomMinus" aria-label="縮小">−</button>
    <span id="zoomLabel">100%</span>
    <button type="button" id="zoomPlus" aria-label="拡大">＋</button>
    <input type="range" id="zoomRange" min="60" max="150" step="5" value="100" aria-label="表示倍率">
    <button type="button" id="zoomReset">倍率を戻す</button>
    <span style="font-size:12px;color:#64748b">60〜150%</span>
  </div>

  <div class="table-wrap">
    <div class="table-zoom-content" id="tableZoomContent">
      <table id="shiftTable" class="densuke-table"></table>
    </div>
  </div>

  <div class="slot-legend" aria-label="時間帯">
    <span>① 8:00〜10:00</span>
    <span>② 10:00〜12:00</span>
    <span>③ 12:30〜14:15</span>
    <span>④ 14:15〜16:00</span>
    <span>○：出勤予定　×：未登録</span>
  </div>

  <section class="selection-summary" aria-live="polite">
    <h3>選択した日付・時間帯の出勤状況</h3>
    <p class="summary-caption" id="summaryCaption">表の日付、または日付と時間帯をクリックすると、担当者と人数が表示されます。</p>
    <div id="summaryDetails"></div>
  </section>

  <button class="action" id="saveBtn">この週のシフトを保存する</button>

  

  

</div>

<script type="module">

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  setDoc,
  query,
  where,
  Timestamp,
  writeBatch,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";




// ==================================
// Firebase設定
// ==================================

import { db } from "./shared/firebase.js";
import { requireAdmin } from "./shared/auth.js";
import { mountAppShell } from "./shared/app-shell.js";


// ==================================
// 基本設定
// ==================================

let students = [];

let selectedCells = new Set();
let originalCells = new Set();

let scheduledDocsByKey = new Map();
let cellInfoMap = new Map();

let selectedDay = null;
let selectedSlot = null;
let zoomScale = 100;
let currentWeekId = null;

const shifts = [
  { label: "8:00〜10:00", value: "8:00-10:00" },
  { label: "10:00〜12:00", value: "10:00-12:00" },
  { label: "12:30〜14:15", value: "12:30-14:15" },
  { label: "14:15〜16:00", value: "14:15-16:00" }
];

const dayLabels = [
  "月", "火", "水", "木", "金", "土", "日"
];

const statusMessage =
  document.getElementById("statusMessage");

const shiftTable =
  document.getElementById("shiftTable");

const weekSelector =
  document.getElementById("weekSelector");


// ==================================
// 日付関連
// ==================================

function getISOWeekId(date) {

  const d = new Date(Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  ));

  d.setUTCDate(
    d.getUTCDate() + 4 - (d.getUTCDay() || 7)
  );

  const yearStart = new Date(
    Date.UTC(d.getUTCFullYear(), 0, 1)
  );

  const week = Math.ceil(
    (((d - yearStart) / 86400000) + 1) / 7
  );

  return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}


function getWeekDates(weekId) {

  const [year, week] = weekId.split("-W").map(Number);

  const jan4 = new Date(Date.UTC(year, 0, 4));

  const monday = new Date(jan4);

  monday.setUTCDate(
    jan4.getUTCDate()
    - ((jan4.getUTCDay() + 6) % 7)
    + (week - 1) * 7
  );

  return Array.from({ length: 7 }, (_, i) => {

    const d = new Date(monday);

    d.setUTCDate(monday.getUTCDate() + i);

    return new Date(
      d.getUTCFullYear(),
      d.getUTCMonth(),
      d.getUTCDate()
    );

  });
}


function dateToKey(date) {

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}


function makeCellKey(userId, dateKey, shift) {

  return `${userId}|${dateKey}|${shift}`;
}

// ==================================
// 管理者権限確認と共通ナビゲーション
// ==================================

requireAdmin({
  loginUrl: "./index.html",
  deniedUrl: "./employee_home.html",
  onReady: async ({ profile }) => {
    mountAppShell({ active: "attendance", profile, homeHref: "./home.html", logoutUrl: "./index.html", links: [
      { id: "home", label: "ホーム", href: "./home.html" },
      { id: "attendance", label: "出勤", href: "./employee_home.html" },
      { id: "learning", label: "学習", href: "./learning/index.html" },
      { id: "wood", label: "木材", href: "./wood/index.html" }
    ] });

    try {
      await loadStudents();
      currentWeekId = getISOWeekId(new Date());
      const monday = getWeekDates(currentWeekId)[0];
      weekSelector.value = dateToKey(monday);
      await loadWeek(currentWeekId);
    } catch (error) {
      console.error(error);
      statusMessage.textContent = "データの読み込みに失敗しました。";
    }
  }
});

// ==================================
// 生徒一覧読み込み
// ==================================

async function loadStudents() {

  const snapshot = await getDocs(
    collection(db, "students")
  );

  students = snapshot.docs
    .map(docSnap => {
      const data = docSnap.data();
      // students/{UID} の各ドキュメント内にある id を表示順の基準にする。
      // id が未設定の場合のみ、FirestoreドキュメントID（UID）を代替値にする。
      const sortId = data.id ?? docSnap.id;

      return {
        id: docSnap.id,
        sortId: String(sortId),
        name: data.name,
        role: data.role
      };
    })
    // 数字部分を数値として比較し、生徒IDの昇順に固定する。
    .sort((a, b) =>
      a.sortId.localeCompare(b.sortId, "en", {
        numeric: true,
        sensitivity: "base"
      })
    );

}


// ==================================
// 週の読み込み
// ==================================

async function loadWeek(weekId) {

  if (!weekId) return;

  currentWeekId = weekId;
  statusMessage.textContent =
    "シフトを読み込み中...";

  selectedCells = new Set();
  originalCells = new Set();
  selectedDay = null;
  selectedSlot = null;

  scheduledDocsByKey = new Map();
  cellInfoMap = new Map();

  const weekDates = getWeekDates(weekId);

  const startDate = weekDates[0];

  const endDate = new Date(weekDates[6]);

  endDate.setDate(endDate.getDate() + 1);

  const startTimestamp =
    Timestamp.fromDate(startDate);

  const endTimestamp =
    Timestamp.fromDate(endDate);


  // 週の表示
  document.getElementById(
    "selectedWeekLabel"
  ).textContent =
    `${dateToKey(weekDates[0])} 〜 ${dateToKey(weekDates[4])}`;


  // 先に表を描画する。出勤データの取得に失敗しても、日付・利用者一覧は表示する。
  buildShiftTable(weekDates);

  // attendanceItemsから対象週の記録を取得
  const attendanceQuery = query(

    collection(db, "attendanceItems"),

    where("date", ">=", startTimestamp),

    where("date", "<", endTimestamp)

  );

  let snapshot;
  try {
    snapshot = await getDocs(attendanceQuery);
  } catch (error) {
    console.error("出勤データの取得に失敗しました:", error);
    originalCells = new Set(selectedCells);
    buildShiftTable(weekDates);
    statusMessage.textContent = "出勤データを取得できませんでした。日付と利用者一覧のみ表示しています。";
    return;
  }

  // 出勤予定だけを読み込む
  snapshot.docs.forEach(docSnap => {

    const data = docSnap.data();

    if (data.state !== "出勤予定") return;

    if (!data.userId || !data.shift || !data.date) return;

    const dateKey = dateToKey(data.date.toDate());

    const key = makeCellKey(
      data.userId,
      dateKey,
      data.shift
    );

    selectedCells.add(key);

    if (!scheduledDocsByKey.has(key)) {
      scheduledDocsByKey.set(key, []);
    }

    scheduledDocsByKey.get(key).push(docSnap.id);

  });


  originalCells = new Set(selectedCells);

  buildShiftTable(weekDates);

  statusMessage.textContent = `表を読み込みました（利用者 ${students.length} 人・20 枠）。`;

}


// ==================================
// シフトテーブル作成
// ==================================

function buildShiftTable(weekDates) {

  shiftTable.innerHTML = "";
  shiftTable.classList.add("densuke-table");

  const colgroup = document.createElement("colgroup");
  const dateCol = document.createElement("col");
  dateCol.style.width = "112px";
  colgroup.appendChild(dateCol);
  const slotCol = document.createElement("col");
  slotCol.style.width = "82px";
  colgroup.appendChild(slotCol);
  students.forEach(() => {
    const col = document.createElement("col");
    col.style.width = "100px";
    colgroup.appendChild(col);
  });
  shiftTable.appendChild(colgroup);

  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  const dateTitle = document.createElement("th");
  dateTitle.textContent = "日付";
  headerRow.appendChild(dateTitle);

  const slotTitle = document.createElement("th");
  slotTitle.textContent = "時間帯";
  headerRow.appendChild(slotTitle);

  students.forEach(student => {
    const th = document.createElement("th");
    th.className = "student-header";
    th.textContent = student.name || "名前未設定";
    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);
  shiftTable.appendChild(thead);

  const tbody = document.createElement("tbody");

  weekDates.slice(0, 5).forEach((date, dayIndex) => {
    const dateKey = dateToKey(date);

    shifts.forEach((shift, shiftIndex) => {
      const row = document.createElement("tr");
      row.dataset.pickDay = String(dayIndex);
      row.dataset.pickSlot = String(shiftIndex);

      if (shiftIndex === 0) {
        const dateCell = document.createElement("td");
        dateCell.className = "date-cell";
        dateCell.rowSpan = shifts.length;
        dateCell.dataset.pickDay = String(dayIndex);
        dateCell.tabIndex = 0;
        dateCell.setAttribute("role", "button");
        dateCell.setAttribute("aria-label", "日付 " + dayLabels[dayIndex] + "曜日 " + (date.getMonth() + 1) + "/" + date.getDate());
        dateCell.textContent = (date.getMonth() + 1) + "/" + date.getDate() + "（" + dayLabels[dayIndex] + "）";
        row.appendChild(dateCell);
      }

      const slotCell = document.createElement("td");
      slotCell.className = "slot-cell";
      slotCell.dataset.pickDay = String(dayIndex);
      slotCell.dataset.pickSlot = String(shiftIndex);
      slotCell.tabIndex = 0;
      slotCell.setAttribute("role", "button");
      slotCell.setAttribute("aria-label", (date.getMonth() + 1) + "/" + date.getDate() + " " + ["①", "②", "③", "④"][shiftIndex]);
      slotCell.textContent = ["①", "②", "③", "④"][shiftIndex];
      row.appendChild(slotCell);

      students.forEach(student => {
        const td = document.createElement("td");
        td.className = "assignment-cell";

        const key = makeCellKey(student.id, dateKey, shift.value);
        cellInfoMap.set(key, {
          userId: student.id,
          date: date,
          dateKey: dateKey,
          shift: shift.value,
          shiftIndex: shiftIndex
        });

        const button = document.createElement("button");
        button.type = "button";
        button.className = "cell";
        button.dataset.key = key;
        updateCellDisplay(button, key);

        button.addEventListener("click", () => {
          if (selectedCells.has(key)) {
            selectedCells.delete(key);
          } else {
            selectedCells.add(key);
          }
          updateCellDisplay(button, key);
          updateSelectionSummary();
        });

        td.appendChild(button);
        row.appendChild(td);
      });

      tbody.appendChild(row);
    });
  });

  shiftTable.appendChild(tbody);
  updateSelectionSummary();
}


// ==================================
// セル表示更新
// ==================================

function updateCellDisplay(button, key) {

  const isScheduled = selectedCells.has(key);
  button.textContent = isScheduled ? "○" : "×";
  button.classList.toggle("is-scheduled", isScheduled);
  button.classList.toggle("is-not-scheduled", !isScheduled);
  button.setAttribute("aria-pressed", String(isScheduled));

  const info = cellInfoMap.get(key);
  if (info) {
    const student = students.find(item => item.id === info.userId);
    const name = student ? student.name : "従業員";
    button.setAttribute(
      "aria-label",
      name + " " + info.dateKey + " " + shifts[info.shiftIndex].label + " " + (isScheduled ? "出勤予定" : "未登録")
    );
  }
}


function updateSelectionStyles() {
  shiftTable.querySelectorAll("tbody tr").forEach(row => {
    row.classList.remove("is-selected-row");
    if (selectedDay === null) return;
    if (Number(row.dataset.pickDay) !== selectedDay) return;

    // 日付だけの選択なら、その日の4行すべてを強調。
    // 時間帯を選択した場合は、該当する1行だけを強調。
    if (selectedSlot === null || Number(row.dataset.pickSlot) === selectedSlot) {
      row.classList.add("is-selected-row");
    }
  });

  shiftTable.querySelectorAll(".date-cell, .slot-cell").forEach(element => {
    element.classList.remove("is-selected-day", "is-selected-slot");
    if (selectedDay === null || Number(element.dataset.pickDay) !== selectedDay) return;
    if (element.classList.contains("date-cell")) {
      element.classList.add("is-selected-day");
    } else if (selectedSlot !== null && Number(element.dataset.pickSlot) === selectedSlot) {
      element.classList.add("is-selected-slot");
    }
  });
}

function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function updateSelectionSummary() {
  updateSelectionStyles();

  const caption = document.getElementById("summaryCaption");
  const details = document.getElementById("summaryDetails");
  if (!caption || !details) return;

  if (selectedDay === null || !weekSelector.value) {
    caption.textContent = "表の日付、または日付と時間帯をクリックすると、担当者と人数が表示されます。";
    details.innerHTML = "";
    return;
  }

  const date = getWeekDates(currentWeekId)[selectedDay];
  const dateLabel = (date.getMonth() + 1) + "/" + date.getDate() + "（" + dayLabels[selectedDay] + "）";
  const targetShiftIndexes = selectedSlot === null
    ? shifts.map((shift, index) => index)
    : [selectedSlot];

  const uniqueStudents = new Map();
  let totalAssignments = 0;
  let sections = "";

  targetShiftIndexes.forEach(shiftIndex => {
    const shift = shifts[shiftIndex];
    const assignedStudents = students.filter(student =>
      selectedCells.has(makeCellKey(student.id, dateToKey(date), shift.value))
    );

    totalAssignments += assignedStudents.length;
    assignedStudents.forEach(student => uniqueStudents.set(student.id, student));

    const names = assignedStudents.length
      ? assignedStudents.map(student => '<span class="summary-name">' + escapeHtml(student.name || "名前未設定") + '</span>').join("")
      : '<span class="empty-summary">該当者はいません。</span>';

    sections += '<div class="summary-slot">' +
      '<div class="summary-slot-title">' + ["①", "②", "③", "④"][shiftIndex] +
      "　" + escapeHtml(shift.label) + "（" + assignedStudents.length + "人）</div>" +
      '<div class="summary-names">' + names + "</div></div>";
  });

  caption.textContent = selectedSlot === null
    ? dateLabel + "・全時間帯"
    : dateLabel + "・" + ["①", "②", "③", "④"][selectedSlot] + " " + shifts[selectedSlot].label;

  details.innerHTML =
    '<div class="summary-stats">' +
      '<div class="summary-stat"><small>出勤人数（重複を除く）</small><strong>' + uniqueStudents.size + "人</strong></div>" +
      '<div class="summary-stat"><small>延べ出勤枠</small><strong>' + totalAssignments + "人分</strong></div>" +
    "</div>" + sections;
}

shiftTable.addEventListener("click", event => {
  const target = event.target.closest(".date-cell, .slot-cell");
  if (!target) return;

  const day = Number(target.dataset.pickDay);

  if (target.dataset.pickSlot !== undefined) {
    const slot = Number(target.dataset.pickSlot);
    if (selectedDay === day && selectedSlot === slot) {
      selectedDay = null;
      selectedSlot = null;
    } else {
      selectedDay = day;
      selectedSlot = slot;
    }
  } else if (selectedDay === day && selectedSlot === null) {
    selectedDay = null;
    selectedSlot = null;
  } else {
    selectedDay = day;
    selectedSlot = null;
  }

  updateSelectionSummary();
});

shiftTable.addEventListener("keydown", event => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const target = event.target.closest(".date-cell, .slot-cell");
  if (!target) return;
  event.preventDefault();
  target.click();
});


// ==================================
// 保存処理
// ==================================

document.getElementById("saveBtn").onclick =
async () => {

  const weekId = currentWeekId;

  if (!weekId) return;

  const saveBtn = document.getElementById("saveBtn");

  saveBtn.disabled = true;

  statusMessage.textContent =
    "保存しています...";

  try {

    const weekDates = getWeekDates(weekId);

    const batch = writeBatch(db);


    // 週情報を保存
    const groupRef = doc(
      db,
      "attendanceGroups",
      weekId
    );

    batch.set(groupRef, {

      weekId: weekId,

      startDate: Timestamp.fromDate(
        weekDates[0]
      ),

      endDate: Timestamp.fromDate(
        weekDates[6]
      ),

      notes: "",

      check: false

    }, { merge: true });


    // セルごとの変更を保存
    for (const [key, info] of cellInfoMap) {

      const wasSelected =
        originalCells.has(key);

      const isSelected =
        selectedCells.has(key);


      // 新しく追加されたシフト
      if (isSelected && !wasSelected) {

        const documentId =
          `shift_${encodeURIComponent(info.userId)}_${info.dateKey}_${info.shiftIndex}`;

        const itemRef = doc(
          db,
          "attendanceItems",
          documentId
        );

        batch.set(itemRef, {

          userId: info.userId,

          date: Timestamp.fromDate(info.date),

          shift: info.shift,

          state: "出勤予定",

          time: "",

          notes: "",

          check: false,

          history: []

        });

      }


      // 削除されたシフト
      if (!isSelected && wasSelected) {

        const oldDocs =
          scheduledDocsByKey.get(key) || [];

        oldDocs.forEach(documentId => {

          const itemRef = doc(
            db,
            "attendanceItems",
            documentId
          );

          batch.delete(itemRef);

        });

      }

    }


    await batch.commit();

    // 保存後に再読み込み
    await loadWeek(weekId);

    statusMessage.textContent =
      "シフトを保存しました！";

  } catch (error) {

    console.error(error);

    statusMessage.textContent =
      "保存に失敗しました。";

  } finally {

    saveBtn.disabled = false;

  }

};


// ==================================
// 週変更
// ==================================

weekSelector.addEventListener("change", async () => {
  if (!weekSelector.value) return;

  try {
    const [year, month, day] = weekSelector.value.split("-").map(Number);
    const pickedDate = new Date(year, month - 1, day);
    const weekId = getISOWeekId(pickedDate);
    currentWeekId = weekId;
    const monday = getWeekDates(weekId)[0];

    // 選択した日付が属する週の月曜日にカレンダーをそろえる
    weekSelector.value = dateToKey(monday);
    await loadWeek(weekId);
  } catch (error) {
    console.error(error);
    statusMessage.textContent = "シフトの読み込みに失敗しました。";
  }
});

// 表の拡大・縮小
function applyZoom() {
  const content = document.getElementById("tableZoomContent");
  content.style.zoom = String(zoomScale / 100);
  document.getElementById("zoomRange").value = String(zoomScale);
  document.getElementById("zoomLabel").textContent = zoomScale + "%";
}
document.getElementById("zoomRange").addEventListener("input", event => {
  zoomScale = Number(event.target.value);
  applyZoom();
});
document.getElementById("zoomMinus").addEventListener("click", () => {
  zoomScale = Math.max(60, zoomScale - 5);
  applyZoom();
});
document.getElementById("zoomPlus").addEventListener("click", () => {
  zoomScale = Math.min(150, zoomScale + 5);
  applyZoom();
});
document.getElementById("zoomReset").addEventListener("click", () => {
  zoomScale = 100;
  applyZoom();
});
applyZoom();


</script>
