
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./shared/app-shell.css?v=20261120-10">
<title>週シフト作成 - 管理者</title>

<style>
  body {
    font-family: sans-serif;
    background: #f5f5f5;
    padding: 20px;
    margin: 0;
  }

  .container {
    max-width: 1100px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
  }

  .week-area {
    margin: 20px 0;
    text-align: center;
  }

  .week-area input {
    padding: 8px;
    font-size: 16px;
  }

  #selectedWeekLabel {
    margin-top: 10px;
    font-weight: bold;
  }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    margin-top: 20px;
  }

  table {
    border-collapse: collapse;
    min-width: 1250px;
    width: 100%;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
    white-space: nowrap;
  }

  th {
    background: #f0f0f0;
  }

  .date-header {
    background: #e0e0e0;
    font-weight: bold;
  }

  .name-cell {
    min-width: 90px;
    background: #f7f7f7;
    position: sticky;
    left: 0;
    z-index: 1;
  }

  .cell {
    width: 55px;
    height: 40px;
    border: none;
    background: white;
    cursor: pointer;
    font-size: 20px;
  }

  .cell:hover {
    background: #f0f8ff;
  }

  .cell.selected {
    color: #219653;
    font-weight: bold;
  }

  button.action {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-size: 15px;
  }

  #saveBtn {
    background: #4caf50;
  }

  

  

  #statusMessage {
    text-align: center;
    color: #555;
    min-height: 20px;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
<meta name="robots" content="noindex, nofollow">
<meta name="robots" content="noindex, nofollow">
</head>

<body class="app-shell-pending">

<div class="container">

  <h2>管理者：週シフト作成</h2>

  <div class="week-area">
    <label for="weekSelector">対象週：</label>
    <input type="week" id="weekSelector">

    <p id="selectedWeekLabel"></p>
  </div>

  <p id="statusMessage">読み込み中...</p>

  <div class="table-wrap">
    <table id="shiftTable"></table>
  </div>

  <button class="action" id="saveBtn">
    この週のシフトを保存する
  </button>

  

  

</div>

<script type="module">

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  setDoc,
  query,
  where,
  Timestamp,
  writeBatch,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";




// ==================================
// Firebase設定
// ==================================

import { db } from "./shared/firebase.js";
import { requireAdmin } from "./shared/auth.js";
import { mountAppShell } from "./shared/app-shell.js?v=20261120-10";


// ==================================
// 基本設定
// ==================================

let students = [];

let selectedCells = new Set();
let originalCells = new Set();

let scheduledDocsByKey = new Map();
let cellInfoMap = new Map();

const shifts = [
  { label: "8:00〜10:00", value: "8:00-10:00" },
  { label: "10:00〜12:00", value: "10:00-12:00" },
  { label: "12:30〜14:15", value: "12:30-14:15" },
  { label: "14:15〜16:00", value: "14:15-16:00" }
];

const dayLabels = [
  "月", "火", "水", "木", "金", "土", "日"
];

const statusMessage =
  document.getElementById("statusMessage");

const shiftTable =
  document.getElementById("shiftTable");

const weekSelector =
  document.getElementById("weekSelector");


// ==================================
// 日付関連
// ==================================

function getISOWeekId(date) {

  const d = new Date(Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  ));

  d.setUTCDate(
    d.getUTCDate() + 4 - (d.getUTCDay() || 7)
  );

  const yearStart = new Date(
    Date.UTC(d.getUTCFullYear(), 0, 1)
  );

  const week = Math.ceil(
    (((d - yearStart) / 86400000) + 1) / 7
  );

  return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}


function getWeekDates(weekId) {

  const [year, week] = weekId.split("-W").map(Number);

  const jan4 = new Date(Date.UTC(year, 0, 4));

  const monday = new Date(jan4);

  monday.setUTCDate(
    jan4.getUTCDate()
    - ((jan4.getUTCDay() + 6) % 7)
    + (week - 1) * 7
  );

  return Array.from({ length: 7 }, (_, i) => {

    const d = new Date(monday);

    d.setUTCDate(monday.getUTCDate() + i);

    return new Date(
      d.getUTCFullYear(),
      d.getUTCMonth(),
      d.getUTCDate()
    );

  });
}


function dateToKey(date) {

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}


function makeCellKey(userId, dateKey, shift) {

  return `${userId}|${dateKey}|${shift}`;
}

// ==================================
// 管理者権限確認と共通ナビゲーション
// ==================================

requireAdmin({
  loginUrl: "./index.html",
  deniedUrl: "./employee_home.html",
  onReady: async ({ profile }) => {
    mountAppShell({ active: "attendance", profile, homeHref: "./home.html", logoutUrl: "./index.html", links: [
      { id: "home", label: "ホーム", href: "./home.html" },
      { id: "attendance", label: "出勤", href: "./employee_home.html" },
      { id: "learning", label: "学習", href: "./learning/index.html" },
      { id: "wood", label: "木材", href: "./wood/index.html" }
    ] });

    try {
      await loadStudents();
      const currentWeek = getISOWeekId(new Date());
      weekSelector.value = currentWeek;
      await loadWeek(currentWeek);
    } catch (error) {
      console.error(error);
      statusMessage.textContent = "データの読み込みに失敗しました。";
    }
  }
});

// ==================================
// 生徒一覧読み込み
// ==================================

async function loadStudents() {

  const snapshot = await getDocs(
    collection(db, "students")
  );

  students = snapshot.docs

    .map(docSnap => ({
      id: docSnap.id,
      name: docSnap.data().name,
      role: docSnap.data().role
    }))
.sort((a, b) =>
      (a.name || "").localeCompare(
        b.name || "",
        "ja"
      )
    );

}


// ==================================
// 週の読み込み
// ==================================

async function loadWeek(weekId) {

  if (!weekId) return;

  statusMessage.textContent =
    "シフトを読み込み中...";

  selectedCells = new Set();
  originalCells = new Set();

  scheduledDocsByKey = new Map();
  cellInfoMap = new Map();

  const weekDates = getWeekDates(weekId);

  const startDate = weekDates[0];

  const endDate = new Date(weekDates[6]);

  endDate.setDate(endDate.getDate() + 1);

  const startTimestamp =
    Timestamp.fromDate(startDate);

  const endTimestamp =
    Timestamp.fromDate(endDate);


  // 週の表示
  document.getElementById(
    "selectedWeekLabel"
  ).textContent =
    `${dateToKey(weekDates[0])} 〜 ${dateToKey(weekDates[6])}`;


  // attendanceItemsから対象週の記録を取得
  const attendanceQuery = query(

    collection(db, "attendanceItems"),

    where("date", ">=", startTimestamp),

    where("date", "<", endTimestamp)

  );

  const snapshot = await getDocs(attendanceQuery);


  // 出勤予定だけを読み込む
  snapshot.docs.forEach(docSnap => {

    const data = docSnap.data();

    if (data.state !== "出勤予定") return;

    if (!data.userId || !data.shift || !data.date) return;

    const dateKey = dateToKey(data.date.toDate());

    const key = makeCellKey(
      data.userId,
      dateKey,
      data.shift
    );

    selectedCells.add(key);

    if (!scheduledDocsByKey.has(key)) {
      scheduledDocsByKey.set(key, []);
    }

    scheduledDocsByKey.get(key).push(docSnap.id);

  });


  originalCells = new Set(selectedCells);

  buildShiftTable(weekDates);

  statusMessage.textContent = "";

}


// ==================================
// シフトテーブル作成
// ==================================

function buildShiftTable(weekDates) {

  shiftTable.innerHTML = "";

  const thead = document.createElement("thead");

  // 日付行
  const dateRow = document.createElement("tr");

  const dateTitle = document.createElement("th");

  dateTitle.textContent = "日付";

  dateTitle.className = "name-cell";

  dateRow.appendChild(dateTitle);


  weekDates.forEach((date, i) => {

    const th = document.createElement("th");

    th.colSpan = 4;

    th.className = "date-header";

    th.textContent =
      `${dayLabels[i]}曜日 (${date.getMonth() + 1}/${date.getDate()})`;

    dateRow.appendChild(th);

  });

  thead.appendChild(dateRow);


  // 時間帯行
  const shiftRow = document.createElement("tr");

  const nameTitle = document.createElement("th");

  nameTitle.textContent = "生徒名";

  nameTitle.className = "name-cell";

  shiftRow.appendChild(nameTitle);


  weekDates.forEach(() => {

    shifts.forEach(shift => {

      const th = document.createElement("th");

      th.textContent = shift.label;

      shiftRow.appendChild(th);

    });

  });

  thead.appendChild(shiftRow);

  shiftTable.appendChild(thead);


  // 生徒ごとの行
  const tbody = document.createElement("tbody");

  students.forEach(student => {

    const row = document.createElement("tr");

    const nameCell = document.createElement("td");

    nameCell.textContent = student.name || "名前未設定";

    nameCell.className = "name-cell";

    row.appendChild(nameCell);


    weekDates.forEach(date => {

      const dateKey = dateToKey(date);

      shifts.forEach((shift, shiftIndex) => {

        const td = document.createElement("td");

        const key = makeCellKey(
          student.id,
          dateKey,
          shift.value
        );

        cellInfoMap.set(key, {
          userId: student.id,
          date: date,
          dateKey: dateKey,
          shift: shift.value,
          shiftIndex: shiftIndex
        });

        const button = document.createElement("button");

        button.type = "button";

        button.className = "cell";

        button.dataset.key = key;

        updateCellDisplay(button, key);

        button.addEventListener("click", () => {

          if (selectedCells.has(key)) {
            selectedCells.delete(key);
          } else {
            selectedCells.add(key);
          }

          updateCellDisplay(button, key);

        });

        td.appendChild(button);

        row.appendChild(td);

      });

    });

    tbody.appendChild(row);

  });

  shiftTable.appendChild(tbody);

}


// ==================================
// セル表示更新
// ==================================

function updateCellDisplay(button, key) {

  if (selectedCells.has(key)) {

    button.textContent = "○";

    button.classList.add("selected");

    button.setAttribute("aria-pressed", "true");

  } else {

    button.textContent = "";

    button.classList.remove("selected");

    button.setAttribute("aria-pressed", "false");

  }

}


// ==================================
// 保存処理
// ==================================

document.getElementById("saveBtn").onclick =
async () => {

  const weekId = weekSelector.value;

  if (!weekId) return;

  const saveBtn = document.getElementById("saveBtn");

  saveBtn.disabled = true;

  statusMessage.textContent =
    "保存しています...";

  try {

    const weekDates = getWeekDates(weekId);

    const batch = writeBatch(db);


    // 週情報を保存
    const groupRef = doc(
      db,
      "attendanceGroups",
      weekId
    );

    batch.set(groupRef, {

      weekId: weekId,

      startDate: Timestamp.fromDate(
        weekDates[0]
      ),

      endDate: Timestamp.fromDate(
        weekDates[6]
      ),

      notes: "",

      check: false

    }, { merge: true });


    // セルごとの変更を保存
    for (const [key, info] of cellInfoMap) {

      const wasSelected =
        originalCells.has(key);

      const isSelected =
        selectedCells.has(key);


      // 新しく追加されたシフト
      if (isSelected && !wasSelected) {

        const documentId =
          `shift_${encodeURIComponent(info.userId)}_${info.dateKey}_${info.shiftIndex}`;

        const itemRef = doc(
          db,
          "attendanceItems",
          documentId
        );

        batch.set(itemRef, {

          userId: info.userId,

          date: Timestamp.fromDate(info.date),

          shift: info.shift,

          state: "出勤予定",

          time: "",

          notes: "",

          check: false,

          history: []

        });

      }


      // 削除されたシフト
      if (!isSelected && wasSelected) {

        const oldDocs =
          scheduledDocsByKey.get(key) || [];

        oldDocs.forEach(documentId => {

          const itemRef = doc(
            db,
            "attendanceItems",
            documentId
          );

          batch.delete(itemRef);

        });

      }

    }


    await batch.commit();

    // 保存後に再読み込み
    await loadWeek(weekId);

    statusMessage.textContent =
      "シフトを保存しました！";

  } catch (error) {

    console.error(error);

    statusMessage.textContent =
      "保存に失敗しました。";

  } finally {

    saveBtn.disabled = false;

  }

};


// ==================================
// 週変更
// ==================================

weekSelector.addEventListener("change", async () => {

  if (weekSelector.value) {

    try {

      await loadWeek(weekSelector.value);

    } catch (error) {

      console.error(error);

      statusMessage.textContent =
        "シフトの読み込みに失敗しました。";

    }

  }

});


</script>

</body>
</html>
