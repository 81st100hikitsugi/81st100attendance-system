<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./shared/app-shell.css">
<title>遅刻・早退確認 - 管理者</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
  .container {
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h2 { text-align:center; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  th {
    background: #f0f0f0;
  }
  .late { background: #ffdddd; }
  .early { background: #ddffdd; }
  a.button {
    display:block;
    padding:12px;
    margin:10px 0;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
    text-align:center;
  }
  
</style>
<meta name="robots" content="noindex, nofollow">
<meta name="robots" content="noindex, nofollow">
</head>

<body>
<div class="container">
  <h2>遅刻・早退確認</h2>
  <p id="statusMessage">読み込み中...</p>

  <table id="resultTable">
    <tr>
      <th>生徒ID</th>
      <th>名前</th>
      <th>予定シフト</th>
      <th>出勤時間</th>
      <th>判定</th>
    </tr>
  </table>
</div>

<script type="module">
  import { 
    getFirestore, collection, getDocs 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  

  import { db } from "./shared/firebase.js";
  import { requireAdmin } from "./shared/auth.js";
  import { mountAppShell } from "./shared/app-shell.js";

  let students = {};
  let latestShift = null;

  const shiftTimes = {
    morning: "09:00",
    noon: "13:00",
    evening: "17:00",
    night: "21:00"
  };

  const days = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
  const labels = ["月","火","水","木","金","土","日"];

  requireAdmin({
    loginUrl: "./index.html",
    deniedUrl: "./employee_home.html",
    onReady: async ({ profile }) => {
      mountAppShell({ active: "attendance", profile, homeHref: "./home.html", logoutUrl: "./index.html", links: [
        { id: "home", label: "ホーム", href: "./home.html" },
        { id: "attendance", label: "出勤", href: "./employee_home.html" },
        { id: "learning", label: "学習", href: "./learning/index.html" },
        { id: "wood", label: "木材", href: "./wood/index.html" }
      ] });
    await loadStudents();
    await loadShift();
    await loadAttendance();
    }
  });

  // 生徒一覧読み込み
  async function loadStudents() {
    const snapshot = await getDocs(collection(db, "students"));
    snapshot.forEach(docSnap => {
      students[docSnap.id] = docSnap.data().name;
    });
  }

  // 最新の週シフト読み込み
  async function loadShift() {
    const snapshot = await getDocs(collection(db, "weeklyShifts"));
    if (!snapshot.empty) {
      latestShift = snapshot.docs[snapshot.docs.length - 1].data();
    }
  }

  // 打刻読み込みと判定
  async function loadAttendance() {
    const snapshot = await getDocs(collection(db, "attendanceItems"));
    const table = document.getElementById("resultTable");

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      if (data.state !== "出勤") return;

      const userId = data.userId;
      const timeStr = data.time;
      const time = new Date(timeStr);

      const dayIndex = time.getDay(); // 0=日曜
      const dayKey = days[dayIndex === 0 ? 6 : dayIndex - 1];

      const shift = latestShift?.[dayKey];
      if (!shift) return;

      let assigned = null;
      for (const key of ["morning","noon","evening","night"]) {
        if (shift[key] === userId) assigned = key;
      }

      if (!assigned) return;

      const limit = shiftTimes[assigned];
      const limitDate = new Date(timeStr.split(" ")[0] + " " + limit);

      let result = "OK";
      let css = "";

      if (time > limitDate) {
        result = "遅刻";
        css = "late";
      }

      const row = document.createElement("tr");
      row.className = css;

      row.innerHTML = `
        <td>${userId}</td>
        <td>${students[userId] || "不明"}</td>
        <td>${labels[days.indexOf(dayKey)]}（${assigned}）</td>
        <td>${timeStr}</td>
        <td>${result}</td>
      `;

      table.appendChild(row);
    });

    document.getElementById("statusMessage").textContent = "";
  }
</script>

</body>
</html>
